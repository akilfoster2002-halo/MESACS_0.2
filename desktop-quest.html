<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Desktop Quest — Mouse &amp; Keyboard Lab</title>
<style>
*{box-sizing:border-box}
:root{
  --bg:#0d1017; --panel:#1b2130; --panel2:#232c40; --line:#36445f;
  --accent:#3ea6ff; --accent2:#7c5cff; --good:#3ddc84; --warn:#ffb020; --bad:#ff6b6b;
  --star:#ffd54a; --text:#eef3ff; --muted:#9fb0cc;
  --font:"Trebuchet MS","Segoe UI",system-ui,-apple-system,sans-serif;
  --hudw:330px;
}
html,body{height:100%;margin:0}
body{font-family:var(--font);background:var(--bg);color:var(--text);overflow:hidden;
     -webkit-user-select:none;user-select:none}
input,textarea{-webkit-user-select:text;user-select:text}
.hidden{display:none !important}
button{font-family:var(--font);cursor:pointer}
#app{display:flex;height:100vh;width:100vw}
#stage{flex:1;position:relative;min-width:0}

/* ---------------- LOGIN ---------------- */
#loginScreen{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(1200px 700px at 30% 20%,#20304d 0%,#0e1420 60%,#080b12 100%)}
.login-card{width:min(560px,92%);background:var(--panel);border:3px solid var(--line);border-radius:22px;
  padding:26px 30px 30px;box-shadow:0 30px 70px rgba(0,0,0,.55);text-align:center}
.lg-logo{font-size:60px;line-height:1}
.login-card h1{margin:6px 0 18px;font-size:28px;letter-spacing:.5px}
.login-card label{display:block;font-size:18px;margin:14px 0 8px;color:var(--text)}
.login-card input{width:100%;padding:16px 18px;font-size:24px;border-radius:14px;border:3px solid var(--line);
  background:#0f1420;color:var(--text);text-align:center;outline:none}
.login-card input:focus{border-color:var(--accent);box-shadow:0 0 0 4px rgba(62,166,255,.22)}
.lg-user{display:flex;align-items:center;justify-content:center;gap:10px;font-size:22px;margin-bottom:6px}
.lg-user span:first-child{font-size:38px}
.lg-privacy{margin-top:10px;font-size:15px;color:var(--warn);background:rgba(255,176,32,.1);
  border:2px dashed rgba(255,176,32,.4);border-radius:12px;padding:8px 10px}
.lg-msg{min-height:24px;margin-top:8px;font-size:17px;color:var(--bad)}
.btn{margin-top:16px;background:var(--accent);color:#04121f;border:none;border-radius:14px;
  padding:14px 24px;font-size:20px;font-weight:bold;box-shadow:0 5px 0 #1f6fb0}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #1f6fb0}
.btn.small{font-size:14px;padding:9px 12px;box-shadow:0 4px 0 #1f6fb0;margin:0}
.btn.ghost{background:var(--panel2);color:var(--text);box-shadow:0 4px 0 #101725}
.btn.good{background:var(--good);color:#052414;box-shadow:0 5px 0 #219a5b}

/* ---------------- DESKTOP SHELL ---------------- */
#desktopScreen{position:absolute;inset:0;display:flex;flex-direction:column}
#topbar{height:38px;flex:none;background:rgba(8,12,20,.92);border-bottom:2px solid #000;
  display:flex;align-items:center;justify-content:space-between;padding:0 8px;font-size:15px}
.tb-btn{background:transparent;border:2px solid transparent;color:var(--text);font-size:15px;
  padding:4px 12px;border-radius:9px}
.tb-btn:hover{background:rgba(255,255,255,.12)}
.tb-mid{color:var(--muted);font-size:14px}
#desk{flex:1;position:relative;overflow:hidden;
  background:
   radial-gradient(900px 600px at 20% 15%, #2c4f6e 0%, transparent 60%),
   radial-gradient(800px 600px at 85% 80%, #3b2f6b 0%, transparent 60%),
   linear-gradient(160deg,#12324a 0%,#101a2c 55%,#0b1120 100%)}
#iconLayer{position:absolute;inset:0;padding:16px;display:grid;
  grid-template-columns:repeat(auto-fill,112px);grid-auto-rows:112px;gap:6px;align-content:start;justify-content:start}
.icon{width:112px;height:112px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:4px;border-radius:14px;border:3px solid transparent;background:transparent;color:#fff;text-align:center}
.icon .em{font-size:46px;line-height:1;filter:drop-shadow(0 3px 4px rgba(0,0,0,.5))}
.icon .nm{font-size:14px;text-shadow:0 2px 4px #000;padding:0 4px;line-height:1.15}
.icon:hover{background:rgba(255,255,255,.10)}
.icon.sel{background:rgba(62,166,255,.30);border-color:var(--accent)}
.icon.pulse{animation:pulse 1.1s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,213,74,.85)}50%{box-shadow:0 0 0 12px rgba(255,213,74,0)}}
#dock{height:66px;flex:none;background:rgba(8,12,20,.92);border-top:2px solid #000;display:flex;
  align-items:center;gap:10px;padding:0 12px}
.dock-launch{display:flex;align-items:center;gap:8px;background:linear-gradient(180deg,#3ea6ff,#2b7fd0);
  color:#04121f;border:none;border-radius:14px;padding:10px 16px;font-size:17px;font-weight:bold;box-shadow:0 4px 0 #17588f}
.dock-launch:active{transform:translateY(2px);box-shadow:0 2px 0 #17588f}
#taskbtns{display:flex;gap:8px;flex:1;overflow:hidden}
.taskbtn{background:var(--panel2);border:2px solid var(--line);color:var(--text);border-radius:10px;
  padding:8px 12px;font-size:14px;white-space:nowrap}
.dock-right{color:var(--muted);font-size:15px}

/* launcher + menus */
#launcher{position:absolute;left:0;right:0;bottom:0;top:0;background:rgba(8,12,20,.88);
  padding:40px;display:flex;flex-direction:column;align-items:center;gap:18px;z-index:60}
#launcher h2{margin:0;font-size:26px}
.lch-grid{display:grid;grid-template-columns:repeat(4,130px);gap:14px}
.lch{background:var(--panel2);border:3px solid var(--line);border-radius:16px;padding:14px 8px;color:var(--text);
  display:flex;flex-direction:column;align-items:center;gap:6px;font-size:14px}
.lch:hover{border-color:var(--accent);background:#2b3854}
.lch .em{font-size:38px}
#sysmenu{position:absolute;right:10px;top:8px;width:250px;background:var(--panel);border:3px solid var(--line);
  border-radius:16px;padding:14px;z-index:70;box-shadow:0 20px 50px rgba(0,0,0,.6)}
#sysmenu .row{display:flex;justify-content:space-between;padding:8px 4px;font-size:16px;border-bottom:1px solid var(--line)}
#sysmenu .row:last-child{border:none}
#ctxmenu{position:absolute;z-index:90;background:var(--panel);border:3px solid var(--line);border-radius:12px;
  padding:6px;min-width:180px;box-shadow:0 14px 40px rgba(0,0,0,.6)}
#ctxmenu button{display:block;width:100%;text-align:left;background:transparent;border:none;color:var(--text);
  padding:10px 12px;font-size:16px;border-radius:8px}
#ctxmenu button:hover{background:var(--accent);color:#04121f}

/* windows */
.win{position:absolute;background:var(--panel);border:3px solid var(--line);border-radius:14px;
  box-shadow:0 24px 60px rgba(0,0,0,.6);display:flex;flex-direction:column;overflow:hidden;z-index:20}
.win-bar{height:44px;flex:none;display:flex;align-items:center;
  justify-content:space-between;padding:0 8px 0 14px;cursor:grab;background:#2a3550;border-bottom:2px solid #161e2e}
.win-bar b{font-size:16px}
.win-x{width:34px;height:34px;border-radius:9px;border:none;background:#b23b3b;color:#fff;font-size:18px;font-weight:bold}
.win-x:hover{background:#e04b4b}
.win-body{flex:1;overflow:auto;position:relative;background:#151b28}

/* coach + spotlight */
#coach{position:absolute;left:16px;bottom:82px;max-width:520px;display:flex;gap:12px;align-items:flex-end;z-index:80}
.coach-face{font-size:44px;filter:drop-shadow(0 4px 6px rgba(0,0,0,.6))}
.coach-bub{background:#fffbe8;color:#1a1a1a;border:3px solid var(--star);border-radius:18px;padding:12px 16px;
  font-size:19px;line-height:1.35;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.coach-bub .pics{display:flex;gap:10px;margin-top:8px;align-items:center}
#spot{position:fixed;border-radius:16px;box-shadow:0 0 0 9999px rgba(0,0,0,.55);pointer-events:none;z-index:75;
  border:4px solid var(--star);transition:all .18s ease}

/* ---------------- HUD ---------------- */
#hud{width:var(--hudw);flex:none;background:var(--panel);border-left:4px solid var(--line);
  display:flex;flex-direction:column;padding:14px;gap:10px;overflow:auto}
.hud-title{font-size:22px;font-weight:bold}
.hud-sub{color:var(--muted);font-size:15px}
.hud-part{background:var(--accent2);color:#fff;border-radius:12px;padding:9px 12px;font-size:16px;font-weight:bold}
.hud-stars{font-size:26px;color:var(--star);font-weight:bold}
.hud-now{background:var(--panel2);border:3px solid var(--accent);border-radius:14px;padding:10px 12px}
.hud-now .lbl{font-size:12px;letter-spacing:1.5px;color:var(--accent);font-weight:bold}
#hudTask{font-size:18px;margin-top:6px;line-height:1.3}
#questList{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
#questList li{font-size:15px;padding:8px 10px;border-radius:10px;background:#161d2c;border-left:5px solid var(--line);color:var(--muted)}
#questList li.cur{border-left-color:var(--accent);color:var(--text);background:#1d2740}
#questList li.done{border-left-color:var(--good);color:var(--good);text-decoration:line-through}
.hud-badges{display:flex;flex-wrap:wrap;gap:6px}
.badge{background:#20304a;border:2px solid var(--good);border-radius:20px;padding:5px 10px;font-size:13px}
.hud-btns{margin-top:auto;display:grid;grid-template-columns:1fr 1fr;gap:6px}

/* mouse pictograms */
.mouse-pic{display:inline-flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;color:#333}
svg.ms{width:34px;height:48px}
.ms .body{fill:#fff;stroke:#333;stroke-width:4}
.ms .btn{fill:#dfe6f0;stroke:#333;stroke-width:3}
.ms .on{fill:#ff5f5f}
.ms .wheel{fill:#333}

/* helper sheet */
#helper{position:fixed;right:calc(var(--hudw) + 10px);bottom:16px;width:min(420px,52vw);max-height:78vh;overflow:auto;background:#fffbe8;color:#1a1a1a;
  border:4px solid var(--star);border-radius:18px;padding:16px;z-index:200;box-shadow:0 24px 60px rgba(0,0,0,.6)}
#helper h3{margin:0 0 10px;font-size:22px}
.hp-row{display:flex;align-items:center;gap:12px;padding:8px 6px;border-bottom:2px dashed #e2d5a5}
.hp-row:last-child{border:none}
.hp-em{font-size:32px;width:44px;text-align:center}
.hp-tx b{font-size:18px}
.hp-tx div{font-size:14px;color:#4a4636}

/* modal / teacher / certificate */
#modal{position:fixed;inset:0;background:rgba(5,8,14,.78);display:flex;align-items:center;justify-content:center;z-index:300}
.modal-card{width:min(620px,92%);background:var(--panel);border:4px solid var(--star);border-radius:22px;padding:26px;text-align:center}
.modal-card h2{margin:0 0 10px;font-size:30px}
.modal-card p{font-size:19px;line-height:1.4}
#teacher{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(680px,94%);max-height:86vh;overflow:auto;
  background:var(--panel);border:4px solid var(--accent);border-radius:20px;padding:20px;z-index:310}
#teacher h3{margin:0 0 8px}
#teacher table{width:100%;border-collapse:collapse;font-size:14px;margin:10px 0}
#teacher td,#teacher th{border:1px solid var(--line);padding:6px 8px;text-align:left}
.tch-row{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
#certificate{position:fixed;inset:0;background:#0b1020;display:flex;align-items:center;justify-content:center;z-index:320;padding:20px}
.cert{width:min(820px,96%);background:#fffdf4;color:#1a1a1a;border:14px double #b8952f;border-radius:10px;padding:34px;text-align:center}
.cert h1{font-size:38px;margin:6px 0}
.cert .nm{font-size:44px;color:#123;border-bottom:3px solid #b8952f;display:inline-block;padding:0 30px 6px;margin:12px 0}
.cert ul{text-align:left;display:inline-block;font-size:18px;line-height:1.7}
@media print{ body *{visibility:hidden} #certificate,#certificate *{visibility:visible}
  #certificate{position:absolute;inset:0;background:#fff} .noprint{display:none !important} }

/* picture (support) mode */
body.support .icon .nm{font-size:16px;font-weight:bold;background:rgba(0,0,0,.45);border-radius:8px}
body.support .coach-bub{font-size:22px}
body.support #hudTask{font-size:21px}
.picrow{display:flex;gap:8px;align-items:center;margin-top:8px}
.tag{background:#0f1726;border:2px solid var(--line);border-radius:8px;padding:2px 8px;font-size:13px;color:var(--muted)}

/* smaller lab screens */
@media (max-width:1180px){
  :root{--hudw:264px}
  .icon{width:96px;height:96px} .icon .em{font-size:38px} .icon .nm{font-size:13px}
  #iconLayer{grid-template-columns:repeat(auto-fill,96px);grid-auto-rows:96px}
  .hud-title{font-size:19px} #hudTask{font-size:16px} #questList li{font-size:13.5px}
  #coach{max-width:400px} .coach-bub{font-size:17px}
}
@media (max-width:920px){
  :root{--hudw:224px}
  .lch-grid{grid-template-columns:repeat(3,120px)}
  #coach{max-width:330px} .coach-bub{font-size:15px} svg.ms{width:28px;height:40px}
}

/* game bits */
.game-wrap{position:absolute;inset:0;display:flex;flex-direction:column}
.game-head{flex:none;padding:8px 12px;background:#1c2436;border-bottom:2px solid var(--line);display:flex;
  justify-content:space-between;align-items:center;font-size:16px;gap:10px}
.game-area{flex:1;position:relative;overflow:hidden;background:#101725}
.balloon{position:absolute;width:74px;height:74px;border-radius:50%;border:4px solid rgba(255,255,255,.5);
  font-size:34px;display:flex;align-items:center;justify-content:center;color:#fff;box-shadow:0 6px 18px rgba(0,0,0,.5)}
.balloon:active{transform:scale(.92)}
.shape{position:absolute;width:88px;height:88px;border-radius:14px;display:flex;align-items:center;justify-content:center;
  font-size:40px;border:4px solid transparent;background:#26324c}
.shape.sel{border-color:var(--accent);background:#2f4a74}
.shape.open{border-color:var(--good);background:#1f4a35}
.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.sq-page{position:relative;padding:20px 26px;font-size:18px;line-height:1.6;color:#cdd9ee}
.sq-star{position:absolute;font-size:40px;background:transparent;border:none;filter:drop-shadow(0 0 8px var(--star))}
.kb{display:flex;flex-direction:column;gap:6px;align-items:center;padding:10px}
.kb-row{display:flex;gap:6px}
.key{min-width:44px;height:46px;border-radius:9px;background:#26324c;border:3px solid #3b4a6b;color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:16px;padding:0 10px}
.key.wide{min-width:100px}.key.xwide{min-width:170px}
.key.hot{background:var(--star);color:#231a00;border-color:#fff;animation:pulse 1s infinite}
.key.hit{background:var(--good);color:#04210f}
.prompt-big{font-size:26px;text-align:center;padding:10px}
.type-box{width:92%;margin:8px auto;display:block;font-size:26px;padding:12px;border-radius:12px;
  border:3px solid var(--line);background:#0f1420;color:#fff;text-align:center}
.hunt-list{list-style:none;margin:0;padding:12px;display:flex;flex-direction:column;gap:8px}
.hunt-list li{font-size:17px;background:#1a2233;border-left:6px solid var(--line);padding:10px 12px;border-radius:10px;color:var(--muted)}
.hunt-list li.done{border-left-color:var(--good);color:var(--good)}
.paint-tools{flex:none;display:flex;gap:8px;padding:8px;background:#1c2436;border-bottom:2px solid var(--line);align-items:center}
.swatch{width:34px;height:34px;border-radius:50%;border:3px solid #fff}
.swatch.on{outline:4px solid var(--star)}
.filelist{padding:6px}
.filerow{display:flex;gap:10px;align-items:center;padding:10px;border-radius:8px;font-size:17px}
.filerow:hover{background:#1e293c}
</style>
</head>
<body>
<div id="app">
  <div id="stage">

    <section id="loginScreen">
      <div class="login-card">
        <div class="lg-logo">🐧</div>
        <h1>Computer Lab Login</h1>
        <div id="lgStep1">
          <label>1. Click the box, then type your first name.</label>
          <input id="lgName" maxlength="14" autocomplete="off" placeholder="type here">
          <button id="lgNext" class="btn">Next ▶</button>
        </div>
        <div id="lgStep2" class="hidden">
          <div class="lg-user"><span>🙂</span><span id="lgUser"></span></div>
          <label>2. Type the class password: <b id="lgWord" style="color:var(--star)">star</b> then press <b>Enter</b>.</label>
          <input id="lgPass" type="password" autocomplete="off" placeholder="••••">
          <div class="lg-privacy">🔒 Your password shows as dots. A password is <b>private</b> — we do not share it.</div>
          <button id="lgLogin" class="btn">Log In ⏎</button>
          <div id="lgMsg" class="lg-msg"></div>
        </div>
      </div>
    </section>

    <section id="desktopScreen" class="hidden">
      <div id="topbar">
        <button id="btnLauncherTop" class="tb-btn">☰ Activities</button>
        <div class="tb-mid" id="tbTitle">🐧 Linux Lab — Desktop</div>
        <button id="btnSys" class="tb-btn">📶 🔊 🔋 <span id="clock">--:--</span> ▾</button>
      </div>
      <div id="desk">
        <div id="iconLayer"></div>
        <div id="windows"></div>
        <div id="launcher" class="hidden"></div>
        <div id="sysmenu" class="hidden"></div>
        <div id="ctxmenu" class="hidden"></div>
      </div>
      <div id="dock">
        <button id="btnLauncher" class="dock-launch">🚀 <span>App Launcher</span></button>
        <div id="taskbtns"></div>
        <div class="dock-right" id="deskLabel">🖥️ This is the Desktop</div>
      </div>
    </section>

    <div id="coach" class="hidden">
      <div class="coach-face">🤖</div>
      <div class="coach-bub">
        <div id="coachText">Hi!</div>
        <div class="pics" id="coachPics"></div>
        <button id="coachNext" class="btn small hidden" style="margin-top:8px">Got it ▶</button>
      </div>
    </div>
    <div id="spot" class="hidden"></div>
  </div>

  <aside id="hud">
    <div>
      <div class="hud-title">🖥️ Desktop Quest</div>
      <div class="hud-sub" id="hudName">Player</div>
    </div>
    <div class="hud-part" id="hudPart">Part 1 — Login &amp; Warm-Up</div>
    <div class="hud-stars"><span id="starCount">0</span> ⭐ stars</div>
    <div class="hud-now">
      <div class="lbl">YOUR JOB RIGHT NOW</div>
      <div id="hudTask">Log in to start.</div>
      <div class="picrow" id="hudPics"></div>
    </div>
    <ol id="questList"></ol>
    <div class="hud-badges" id="badges"></div>
    <div class="hud-btns">
      <button id="btnHelper" class="btn small ghost">📖 Helper Sheet</button>
      <button id="btnSupport" class="btn small ghost">🖼️ Picture Mode: OFF</button>
      <button id="btnSound" class="btn small ghost">🔊 Sound: ON</button>
      <button id="btnTeacher" class="btn small ghost">👩‍🏫 Teacher</button>
    </div>
  </aside>
</div>

<div id="helper" class="hidden"></div>
<div id="teacher" class="hidden"></div>
<div id="modal" class="hidden"></div>
<div id="certificate" class="hidden"></div>

<script>
/* =====================================================================
   DESKTOP QUEST — computer navigation + mouse/keyboard control game
   Single file, no network. Open in any browser.
   ===================================================================== */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const rnd=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const pick=a=>a[rnd(0,a.length-1)];

const state={
  name:'Friend', support:false, sound:true,
  part:0, stars:0, badges:[],
  quests:[], qi:0, mode:'seq',
  exit:{mouse:null,key:null}
};

/* ---------- sound ---------- */
let actx=null;
function beep(kind){
  if(!state.sound) return;
  try{
    actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    const o=actx.createOscillator(), g=actx.createGain();
    const map={good:[660,880],star:[784,1175],bad:[200,150],pop:[520,700],key:[440,520]};
    const [f1,f2]=map[kind]||map.good;
    o.type='triangle'; o.frequency.setValueAtTime(f1,actx.currentTime);
    o.frequency.exponentialRampToValueAtTime(f2,actx.currentTime+.12);
    g.gain.setValueAtTime(.12,actx.currentTime);
    g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+.25);
    o.connect(g); g.connect(actx.destination); o.start(); o.stop(actx.currentTime+.26);
  }catch(e){}
}

/* ---------- mouse pictograms (for ELL / picture mode) ---------- */
function mousePic(type,label){
  const on={left:'',right:'',wheel:''};
  if(type==='click'||type==='double') on.left='on';
  if(type==='right') on.right='on';
  if(type==='scroll') on.wheel='on';
  const badge = type==='double' ? '<text x="46" y="20" font-size="18" fill="#ff5f5f" font-weight="bold">x2</text>' : '';
  const svg=`<svg class="ms" viewBox="0 0 70 96">

/* =====================================================================
   QUEST ENGINE
   ===================================================================== */
function setQuests(list,mode='seq'){
  state.quests=list.map(q=>({...q,done:false}));
  state.qi=0; state.mode=mode;
  renderQuests(); showCoach();
}
function currentQuest(){
  if(state.mode==='any') return state.quests.find(q=>!q.done);
  return state.quests[state.qi];
}
function fire(action,data={}){
  const match=q=>!q.done&&q.on===action&&(!q.match||q.match(data));
  let q=null;
  if(state.mode==='any') q=state.quests.find(match);
  else { const c=state.quests[state.qi]; if(c&&match(c)) q=c; }
  if(!q) return false;
  q.done=true; state.stars++; beep('star'); updateStars();
  if(state.mode==='seq') state.qi++;
  renderQuests();
  if(state.quests.every(x=>x.done)){ clearSpot(); setTimeout(()=>partComplete(),450); }
  else { setTimeout(showCoach,120); }
  return true;
}
function renderQuests(){
  const ol=$('#questList'); ol.innerHTML='';
  const cur=currentQuest();
  state.quests.forEach(q=>{
    const li=document.createElement('li');
    li.textContent=(q.done?'✔ ':'• ')+q.short;
    if(q.done) li.className='done'; else if(q===cur) li.className='cur';
    ol.appendChild(li);
  });
}
function updateStars(){ $('#starCount').textContent=state.stars; }
function showCoach(){
  const q=currentQuest();
  $('#coach').classList.remove('hidden');
  if(!q){ $('#coachText').textContent='Nice work!'; $('#coachPics').innerHTML=''; $('#coachNext').classList.add('hidden'); clearSpot(); return; }
  $('#coachText').innerHTML=q.text;
  $('#hudTask').innerHTML=q.text;
  const pics=(q.pics||[]).map(p=>typeof p==='function'?p():p).join('');
  $('#coachPics').innerHTML=pics;
  $('#hudPics').innerHTML=pics;
  $('#coachNext').classList.toggle('hidden',q.on!=='next');
  // never dim the screen while an app window is open — the student is working inside it
  if(q.spot&&Object.keys(openWins).length===0) setTimeout(()=>{
      if(Object.keys(openWins).length===0&&currentQuest()===q) spotlight(q.spot);
    },60);
  else clearSpot();
}
$('#coachNext').onclick=()=>fire('next');

  if(!t){clearSpot();return;}

  s.classList.remove('hidden');
  s.style.left=(r.left-pad)+'px'; s.style.top=(r.top-pad)+'px';
  s.style.width=(r.width+pad*2)+'px'; s.style.height=(r.height+pad*2)+'px';
  $$('.pulse').forEach(e=>e.classList.remove('pulse'));
  t.classList.add('pulse');
}

const openWins={}; let zTop=20;
// the Helper Sheet floats over the right side of the desk — keep things out from under it
function usableW(){
  const d=$('#desk');
  const h=$('#helper');
  return h.classList.contains('hidden') ? d.clientWidth : Math.max(320,d.clientWidth-h.offsetWidth-30);
}
function openApp(id){
  const a=appById(id); if(!a) return;
  if(openWins[id]){ focusWin(id); return; }
  const w=document.createElement('div');
  w.className='win'; w.id='win-'+id;
  const big=['mouse','scroll','keys','paint'].includes(id);
  const W=big?640:460, H=big?450:340;
  const deskR=$('#desk').getBoundingClientRect();
  const useW=usableW();
  w.style.width=Math.min(W,useW-30)+'px';
  w.style.height=Math.min(H,deskR.height-30)+'px';
  w.style.left=Math.max(10,rnd(20,Math.max(40,useW-W-30)))+'px';
  w.style.top=Math.max(10,rnd(20,Math.max(40,deskR.height-H-60)))+'px';
  w.style.zIndex=++zTop;
  w.innerHTML=`<div class="win-bar"><b>${a.em} ${a.name}</b>
      <button class="win-x" title="Close">✕</button></div>
    <div class="win-body"></div>`;
  $('#windows').appendChild(w);
  openWins[id]=w;
  $('.win-x',w).onclick=()=>closeApp(id);
  w.addEventListener('mousedown',()=>focusWin(id));
  dragify(w,$('.win-bar',w));
  buildAppBody(id,$('.win-body',w));
  refreshTaskbar();
  clearSpot();
  beep('pop');
  fire('app:open',{id});
}
function closeApp(id){
  const w=openWins[id]; if(!w) return;
  w.remove(); delete openWins[id];
  refreshTaskbar(); beep('good');
  fire('app:close',{id});
  if(Object.keys(openWins).length===0) fire('desktop:clear');
}
function focusWin(id){ const w=openWins[id]; if(w) w.style.zIndex=++zTop; }
function refreshTaskbar(){
  const t=$('#taskbtns'); t.innerHTML='';
  Object.keys(openWins).forEach(id=>{
    const a=appById(id);
    const b=document.createElement('button'); b.className='taskbtn';
    b.innerHTML=a.em+' '+a.name; b.onclick=()=>focusWin(id);
    t.appendChild(b);
  });
}
function dragify(win,handle){
  let sx,sy,ox,oy,drag=false;
  handle.addEventListener('mousedown',e=>{
    if(e.target.closest('.win-x')) return;
    drag=true; sx=e.clientX; sy=e.clientY;
    ox=parseInt(win.style.left); oy=parseInt(win.style.top);
    handle.style.cursor='grabbing'; e.preventDefault();
  });
  window.addEventListener('mousemove',e=>{
    if(!drag) return;
    const deskR=$('#desk').getBoundingClientRect();
    let nx=ox+e.clientX-sx, ny=oy+e.clientY-sy;
    nx=Math.max(0,Math.min(nx,deskR.width-win.offsetWidth));
    ny=Math.max(0,Math.min(ny,deskR.height-win.offsetHeight));
    win.style.left=nx+'px'; win.style.top=ny+'px';
    if(Math.abs(e.clientX-sx)+Math.abs(e.clientY-sy)>60) fire('win:drag',{});
  });
  window.addEventListener('mouseup',()=>{ drag=false; handle.style.cursor='grab'; });
}

/* =====================================================================
   GAME 1 — MOUSE MASTER  (click / select / double-click / right-click)
   ===================================================================== */
function gameMouse(b){
  const N=state.support?{pop:5,sel:3,dbl:3,rc:1}:{pop:8,sel:3,dbl:5,rc:2};
  b.innerHTML=`<div class="game-wrap">
    <div class="game-head"><span id="mmTitle">Round 1</span><span id="mmScore"></span></div>
    <div class="game-area" id="mmArea"></div></div>`;
  const area=$('#mmArea',b), title=$('#mmTitle',b), score=$('#mmScore',b);
  let misses=0, round=0;
  const AW=()=>area.clientWidth-100, AH=()=>area.clientHeight-100;
  const place=el=>{ el.style.left=rnd(10,Math.max(20,AW()))+'px'; el.style.top=rnd(10,Math.max(20,AH()))+'px'; };
  area.addEventListener('click',e=>{
    if(e.target===area){ misses++; if(misses%3===0) coachSay('Slow down 🐢 — put the arrow ON the picture, then click.'); }
  });

  function head(t,s){ title.innerHTML=t; score.innerHTML=s; }

  function r1(){ // single click
    let got=0; head('Round 1 of 4 — SINGLE CLICK '+PIC.click(), `Popped: <b>0/${N.pop}</b>`);
    coachSay('Pop the balloons with <b>one click</b>.',[PIC.click]);
    area.innerHTML='';
    for(let i=0;i<N.pop;i++){
      const el=document.createElement('button');
      el.className='balloon'; el.textContent='🎈';
      el.style.background=pick(['#e05b6a','#4a8fe0','#4bb87a','#c58ae0','#e0a54b']);
      place(el);
      el.onclick=ev=>{ ev.stopPropagation(); el.remove(); got++; beep('pop');
        head('Round 1 of 4 — SINGLE CLICK '+PIC.click(),`Popped: <b>${got}/${N.pop}</b>`);
        if(got===N.pop) done(r2); };
      area.appendChild(el);
    }
  }
  function r2(){ // select
    let sel=0; head('Round 2 of 4 — SELECT with one click '+PIC.click(),`Chosen: <b>0/${N.sel}</b>`);
    coachSay('<b>One click chooses</b> a thing. Click each shape one time — it turns blue.',[PIC.click]);
    area.innerHTML='';
    for(let i=0;i<N.sel;i++){
      const el=document.createElement('button');
      el.className='shape'; el.textContent=pick(['🔺','🟩','🟦','⬛','🟣']); place(el);
      el.onclick=ev=>{ ev.stopPropagation();
        if(el.classList.contains('sel')) return;
        el.classList.add('sel'); sel++; beep('good');
        head('Round 2 of 4 — SELECT with one click '+PIC.click(),`Chosen: <b>${sel}/${N.sel}</b>`);
        if(sel===N.sel) done(r3); };
      area.appendChild(el);
    }
  }
  function r3(){ // double click
    let op=0; head('Round 3 of 4 — DOUBLE-CLICK to open '+PIC.double(),`Opened: <b>0/${N.dbl}</b>`);
    coachSay('<b>Two fast clicks</b> opens a thing. Double-click every box!',[PIC.double]);
    area.innerHTML='';
    for(let i=0;i<N.dbl;i++){
      const el=document.createElement('button');
      el.className='shape'; el.textContent='📦'; place(el);
      el.onclick=ev=>{ ev.stopPropagation();
        if(el.classList.contains('open')) return;
        el.classList.add('shake'); setTimeout(()=>el.classList.remove('shake'),320);
        coachSay('One click only <b>chooses</b>. Click <b>two times fast</b> to open!',[PIC.double]); };
      el.ondblclick=ev=>{ ev.stopPropagation();
        if(el.classList.contains('open')) return;
        el.classList.add('open'); el.textContent='🎁'; op++; beep('star');
        head('Round 3 of 4 — DOUBLE-CLICK to open '+PIC.double(),`Opened: <b>${op}/${N.dbl}</b>`);
        if(op===N.dbl) done(r4); };
      area.appendChild(el);
    }
  }
  function r4(){ // right click
    let got=0; head('Round 4 of 4 — RIGHT-CLICK for the menu '+PIC.right(),`Menus: <b>0/${N.rc}</b>`);
    coachSay('Press the <b>right</b> mouse button on the folder. A menu appears — then click <b>Open</b>.',[PIC.right]);
    area.innerHTML='';
    for(let i=0;i<N.rc;i++){
      const el=document.createElement('button');
      el.className='shape'; el.textContent='📁'; place(el);
      el.oncontextmenu=ev=>{ ev.preventDefault(); ev.stopPropagation(); popMenu(ev,el); };
      el.onclick=ev=>{ ev.stopPropagation(); coachSay('That is the LEFT button. Use the <b>RIGHT</b> button here.',[PIC.right]); };
      area.appendChild(el);
    }
    function popMenu(ev,el){
      $$('.mini-menu',area).forEach(m=>m.remove());
      const r=area.getBoundingClientRect();
      const m=document.createElement('div'); m.className='mini-menu';

/* =====================================================================
   GAME 3 — KEY HUNT
   ===================================================================== */
let keyGame=null;
const KEY_ROWS=[
  ['1','2','3','4','5','6','7','8','9','0'],
  ['Q','W','E','R','T','Y','U','I','O','P'],
  ['A','S','D','F','G','H','J','K','L'],
  ['Z','X','C','V','B','N','M']
];
function keyLabel(t){
  return {SPACE:'Space bar',ENTER:'Enter ⏎',BACKSPACE:'Backspace ⌫',SHIFT:'Shift ⇧',
    ARROWLEFT:'← Left arrow',ARROWRIGHT:'→ Right arrow',ARROWUP:'↑ Up arrow',ARROWDOWN:'↓ Down arrow'}[t]||t;
}
function tokenOf(e){ return e.key===' '?'SPACE':e.key.toUpperCase(); }
function gameKeys(b){
  const letters=[], L=state.support?3:5, D=state.support?1:2;
  const pool='ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
  while(letters.length<L){ const c=pick(pool); if(!letters.includes(c)) letters.push(c); }
  const digits=[]; while(digits.length<D){ const c=String(rnd(0,9)); if(!digits.includes(c)) digits.push(c); }
  const extras=state.support?['SPACE','ENTER','BACKSPACE','ARROWLEFT','ARROWRIGHT']
                            :['SPACE','ENTER','BACKSPACE','SHIFT','ARROWLEFT','ARROWRIGHT','ARROWUP','ARROWDOWN'];
  const seq=[...letters,...digits,...extras];
  b.innerHTML=`<div class="game-wrap">
    <div class="game-head"><span id="khTitle">⌨️ Key Hunt</span><span id="khScore">0/${seq.length}</span></div>
    <div style="flex:none" id="khPrompt" class="prompt-big">Get ready…</div>
    <div class="game-area" style="overflow:auto" id="khArea"></div></div>`;
  const area=$('#khArea',b), prompt=$('#khPrompt',b), score=$('#khScore',b);
  area.innerHTML=`<div class="kb" id="khBoard">
    ${KEY_ROWS.map(r=>`<div class="kb-row">${r.map(k=>`<div class="key" data-k="${k}">${k}</div>`).join('')}</div>`).join('')}
    <div class="kb-row">
      <div class="key wide" data-k="SHIFT">⇧ Shift</div>
      <div class="key xwide" data-k="SPACE">Space</div>
      <div class="key wide" data-k="BACKSPACE">⌫ Backspace</div>
      <div class="key wide" data-k="ENTER">⏎ Enter</div>
    </div>
    <div class="kb-row">
      <div class="key" data-k="ARROWLEFT">←</div><div class="key" data-k="ARROWUP">↑</div>
      <div class="key" data-k="ARROWDOWN">↓</div><div class="key" data-k="ARROWRIGHT">→</div>
    </div></div>`;
  let i=0, hintTimer=null;
  coachSay('Look at the big word. Find that key on the real keyboard and press it.',[()=>PIC.key('press')]);
  function ask(){
    clearTimeout(hintTimer);
    $$('.key',b).forEach(k=>k.classList.remove('hot'));
    if(i>=seq.length){ return typingRound(); }
    const t=seq[i];
    prompt.innerHTML='Press &nbsp;<b style="color:var(--star)">'+keyLabel(t)+'</b>';
    score.textContent=i+'/'+seq.length;
    const hot=()=>{ const el=$(`.key[data-k="${t}"]`,b); if(el) el.classList.add('hot'); };
    if(state.support) hot(); else hintTimer=setTimeout(hot,4000);
  }
  keyGame={ onKey(e){
    if(!openWins.keys){ keyGame=null; return; }
    if(i>=seq.length) return;
    const t=tokenOf(e);
    if(['SPACE','BACKSPACE','ARROWLEFT','ARROWRIGHT','ARROWUP','ARROWDOWN'].includes(t)) e.preventDefault();
    if(t===seq[i]){
      const el=$(`.key[data-k="${t}"]`,b);
      if(el){ el.classList.add('hit'); setTimeout(()=>el.classList.remove('hit'),260); }
      i++; beep('key'); ask();
    } else if(t.length===1||['SHIFT','ENTER','BACKSPACE','SPACE'].includes(t)){
      prompt.insertAdjacentHTML('beforeend',' <span style="color:var(--bad);font-size:18px">not that one</span>');
      setTimeout(ask,600);
    }
  }};
  function typingRound(){
    clearTimeout(hintTimer);
    score.textContent='Typing';
    $('#khTitle',b).textContent='⌨️ Key Hunt — Typing';
    prompt.innerHTML='Type your <b>name</b>, then press <b>Enter</b>';
    area.innerHTML=`<div style="padding:16px;text-align:center">
      <input class="type-box" id="khType" placeholder="your name" autocomplete="off">
      <div style="color:var(--muted);font-size:16px">Shift ⇧ + a letter = CAPITAL letter. Backspace ⌫ erases.</div></div>`;
    const inp=$('#khType',b); setTimeout(()=>inp.focus(),50);
    area.addEventListener('click',()=>inp.focus());
    keyGame={onKey(){}};
    inp.addEventListener('keydown',e=>{
      if(e.key!=='Enter') return;
      e.preventDefault();
      if(inp.value.trim().length<1){ prompt.innerHTML='Type some letters first, then press <b>Enter</b>'; beep('bad'); return; }
      beep('star'); fixRound(inp.value.trim());
    });
  }
  function fixRound(typed){
    prompt.innerHTML='The box should say <b>cat</b> — press <b>Backspace</b> ⌫ to fix it, then <b>Enter</b>';
    area.innerHTML=`<div style="padding:16px;text-align:center">
      <div style="font-size:20px;color:var(--good);margin-bottom:8px">Nice typing, ${typed}! One more.</div>
      <input class="type-box" id="khFix" value="catt" autocomplete="off">
      <div style="color:var(--muted);font-size:16px">Backspace ⌫ erases the letter before the blinking line.</div></div>`;
    const inp=$('#khFix',b); setTimeout(()=>{inp.focus(); inp.setSelectionRange(4,4);},50);
    const toEnd=()=>setTimeout(()=>inp.setSelectionRange(inp.value.length,inp.value.length),0);
    inp.addEventListener('click',toEnd); inp.addEventListener('focus',toEnd);
    area.addEventListener('click',()=>inp.focus());
    inp.addEventListener('keydown',e=>{
      if(e.key!=='Enter') return;
      e.preventDefault();
      if(inp.value.toLowerCase().trim()==='cat'){ beep('star'); finishKeys(); }
      else { prompt.innerHTML='Not yet — make it say <b>cat</b> with Backspace ⌫, then Enter'; beep('bad'); }
    });
  }
  function finishKeys(){
    prompt.innerHTML='Finished! 🎉';
    area.innerHTML=`<div style="padding:30px;text-align:center">
      <div style="font-size:52px">🏅</div><div style="font-size:24px">Key Hunt finished!</div>
      <div style="color:var(--muted);font-size:17px">Letters • Numbers • Space • Enter • Backspace • Shift • Arrows</div></div>`;
    score.textContent='Done';
    keyGame=null;
    awardBadge('⌨️ Key Finder'); fire('game:done',{id:'keys'});
  }
  ask();
}
document.addEventListener('keydown',e=>{ if(keyGame&&keyGame.onKey) keyGame.onKey(e); });

      <li>✔ Logged in and kept the password private</li>
      <li>✔ Found the desktop, icons, App Launcher, Files, and system menu</li>
      <li>✔ Clicked, double-clicked, right-clicked, and scrolled</li>
      <li>✔ Used letters, numbers, Space, Enter, Backspace, Shift, and arrows</li>
      <li>✔ Opened and closed an application</li>
    </ul>
    <p style="font-size:19px">${state.exit.mouse||''}<br>${state.exit.key||''}</p>
    <p style="font-size:22px;color:#b8952f">${'⭐'.repeat(Math.min(state.stars,15))} &nbsp; ${state.stars} stars</p>
    <p style="font-size:16px">${new Date().toLocaleDateString()} &nbsp;•&nbsp; ${state.badges.join('  ')}</p>
    <div class="noprint" style="margin-top:14px">
      <button class="btn" onclick="window.print()">🖨️ Print</button>
      <button class="btn ghost" id="again">🔄 Play again</button>
    </div></div>`;
  $('#again').onclick=()=>location.reload();
  beep('star');
}

/* =====================================================================
   HELPER SHEET (visual reference for SWIEP / ELL)
   ===================================================================== */
const HELP_ROWS=[
  ['🖥️','Desktop','The main screen. Your icons live here.'],
  ['🖼️','Icon','A small picture that opens an app or folder.'],
  ['🚀','App Launcher','The button that shows all the apps.'],
  ['📁','Files','The app that holds your work.'],
  ['📶','System menu','Wi-Fi, sound, battery, clock (top right).'],
  ['✕','Close','Closes the window / quits the app.']
];
function buildHelper(){
  const h=$('#helper');
  h.innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center;position:sticky;top:-16px;
      background:#fffbe8;padding:4px 0 8px;margin:-4px 0 0"><h3 style="margin:0">📖 Helper Sheet</h3>
      <button class="btn small" id="hpCloseTop">Close</button></div>
    <div class="hp-row"><span class="hp-em">${mousePic('click')}</span><span class="hp-tx"><b>Click</b><div>Press the LEFT button ONE time = choose.</div></span></div>
    <div class="hp-row"><span class="hp-em">${mousePic('double')}</span><span class="hp-tx"><b>Double-click</b><div>Press the LEFT button TWO times fast = open.</div></span></div>
    <div class="hp-row"><span class="hp-em">${mousePic('right')}</span><span class="hp-tx"><b>Right-click</b><div>Press the RIGHT button = a menu appears.</div></span></div>
    <div class="hp-row"><span class="hp-em">${mousePic('scroll')}</span><span class="hp-tx"><b>Scroll</b><div>Roll the wheel = the page moves up and down.</div></span></div>
    ${HELP_ROWS.map(([e,t,d])=>`<div class="hp-row"><span class="hp-em">${e}</span><span class="hp-tx"><b>${t}</b><div>${d}</div></span></div>`).join('')}
    <div class="hp-row"><span class="hp-em">⌨️</span><span class="hp-tx"><b>Keys</b><div>Space = space · Enter ⏎ = go · Backspace ⌫ = erase · Shift ⇧ = CAPITAL · ← ↑ ↓ → = move</div></span></div>
    <button class="btn small" id="hpClose" style="margin-top:10px">Close</button>`;
  $('#hpClose').onclick=()=>h.classList.add('hidden');
  $('#hpCloseTop').onclick=()=>h.classList.add('hidden');
}
$('#btnHelper').onclick=()=>{ $('#helper').classList.toggle('hidden'); };

/* =====================================================================
   TOGGLES + TEACHER PANEL
   ===================================================================== */
$('#btnSupport').onclick=()=>{
  state.support=!state.support;
  document.body.classList.toggle('support',state.support);
  $('#btnSupport').textContent='🖼️ Picture Mode: '+(state.support?'ON':'OFF');
  // keep the sheet out of the way of the login card; it opens with the desktop
  if(state.support&&!$('#desktopScreen').classList.contains('hidden')) $('#helper').classList.remove('hidden');
  if(!state.support) $('#helper').classList.add('hidden');
  try{ localStorage.setItem('dq_support',state.support?'1':'0'); }catch(e){}  // file:// may block storage
  if($('#lgWord')) $('#lgWord').textContent=state.support?'cat':'star';
};
$('#btnSound').onclick=()=>{
  state.sound=!state.sound;
  $('#btnSound').textContent='🔊 Sound: '+(state.sound?'ON':'OFF');
};
$('#btnTeacher').onclick=()=>{ $('#teacher').classList.toggle('hidden'); };
function buildTeacher(){
  $('#teacher').innerHTML=`<h3>👩‍🏫 Teacher Panel</h3>
    <p style="font-size:14px;color:var(--muted)">Objective: SWBAT identify basic Linux desktop features and demonstrate accurate mouse and keyboard control.</p>
    <table>
      <tr><th>Time</th><th>Part</th><th>In the game</th></tr>
      <tr><td>0:00–0:08</td><td>Login &amp; Warm-Up</td><td>Login routine, bubble pop, click vs. double-click</td></tr>
      <tr><td>0:08–0:18</td><td>Teacher Modeling</td><td>Guided tour: desktop, icons, launcher, Files, system menu, scroll, open/close</td></tr>
      <tr><td>0:18–0:38</td><td>Mouse &amp; Keyboard Games</td><td>Mouse Master (4 rounds), Scroll Quest, Key Hunt</td></tr>
      <tr><td>0:38–0:49</td><td>Scavenger Hunt / Closure</td><td>7-item hunt, exit question, certificate</td></tr>
    </table>
    <div class="tch-row">
      <button class="btn small ghost" data-p="1">▶ Part 1</button>
      <button class="btn small ghost" data-p="2">▶ Part 2</button>
      <button class="btn small ghost" data-p="3">▶ Part 3</button>
      <button class="btn small ghost" data-p="4">▶ Part 4</button>
      <button class="btn small ghost" id="tchCert">▶ Exit ticket</button>
    </div>
    <p style="font-size:14px"><b>Picture Mode</b> (SWIEP/ELL): fewer targets, larger labels, key hints shown right away,
    Helper Sheet pinned open, shorter password (<i>cat</i>).</p>
    <div class="tch-row">
      <button class="btn small ghost" id="tchReset">🔄 Restart from login</button>
      <button class="btn small" id="tchClose">Close panel</button>
    </div>`;
  $$('#teacher [data-p]').forEach(b=>b.onclick=()=>{
    $('#teacher').classList.add('hidden'); closeModal();
    Object.keys(openWins).forEach(closeApp);
    [null,startPart1,startPart2,startPart3,startPart4][+b.dataset.p]();
  });
  $('#tchCert').onclick=()=>{ $('#teacher').classList.add('hidden'); exitTicket(); };
  $('#tchReset').onclick=()=>location.reload();
  $('#tchClose').onclick=()=>$('#teacher').classList.add('hidden');
}

/* =====================================================================
   INIT
   ===================================================================== */
buildIcons(); buildLauncher(); buildSys(); buildHelper(); buildTeacher();
try{ if(localStorage.getItem('dq_support')==='1') $('#btnSupport').click(); }catch(e){}
$('#lgName').focus();
window.addEventListener('keydown',e=>{ if(e.key==='Escape'){ toggleLauncher(false); toggleSys(false); hideCtx(); } });
</script>
</body>
</html>
