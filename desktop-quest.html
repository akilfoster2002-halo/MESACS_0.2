<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Desktop Quest — Mouse &amp; Keyboard Lab</title>
<style>
*{box-sizing:border-box}
:root{
  --bg:#0d1017; --panel:#1b2130; --panel2:#232c40; --line:#36445f;
  --accent:#3ea6ff; --accent2:#7c5cff; --good:#3ddc84; --warn:#ffb020; --bad:#ff6b6b;
  --star:#ffd54a; --text:#eef3ff; --muted:#9fb0cc;
  --font:"Trebuchet MS","Segoe UI",system-ui,-apple-system,sans-serif;
  --hudw:330px;
}
html,body{height:100%;margin:0}
body{font-family:var(--font);background:var(--bg);color:var(--text);overflow:hidden;
     -webkit-user-select:none;user-select:none}
input,textarea{-webkit-user-select:text;user-select:text}
.hidden{display:none !important}
button{font-family:var(--font);cursor:pointer}
#app{display:flex;height:100vh;width:100vw}
#stage{flex:1;position:relative;min-width:0}

/* ---------------- LOGIN ---------------- */
#loginScreen{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(1200px 700px at 30% 20%,#20304d 0%,#0e1420 60%,#080b12 100%)}
.login-card{width:min(560px,92%);background:var(--panel);border:3px solid var(--line);border-radius:22px;
  padding:26px 30px 30px;box-shadow:0 30px 70px rgba(0,0,0,.55);text-align:center}
.lg-logo{font-size:60px;line-height:1}
.lg-lang{display:flex;gap:8px;justify-content:center;margin-bottom:6px}
.langbtn{background:var(--panel2);border:3px solid var(--line);color:var(--text);border-radius:12px;
  padding:8px 16px;font-size:17px}
.langbtn:hover{border-color:var(--accent)}
.langbtn.on{background:var(--accent);color:#04121f;border-color:#fff}
.login-card h1{margin:6px 0 18px;font-size:28px;letter-spacing:.5px}
.login-card label{display:block;font-size:18px;margin:14px 0 8px;color:var(--text)}
.login-card input{width:100%;padding:16px 18px;font-size:24px;border-radius:14px;border:3px solid var(--line);
  background:#0f1420;color:var(--text);text-align:center;outline:none}
.login-card input:focus{border-color:var(--accent);box-shadow:0 0 0 4px rgba(62,166,255,.22)}
.lg-user{display:flex;align-items:center;justify-content:center;gap:10px;font-size:22px;margin-bottom:6px}
.lg-user span:first-child{font-size:38px}
.lg-privacy{margin-top:10px;font-size:15px;color:var(--warn);background:rgba(255,176,32,.1);
  border:2px dashed rgba(255,176,32,.4);border-radius:12px;padding:8px 10px}
.lg-msg{min-height:24px;margin-top:8px;font-size:17px;color:var(--bad)}
.btn{margin-top:16px;background:var(--accent);color:#04121f;border:none;border-radius:14px;
  padding:14px 24px;font-size:20px;font-weight:bold;box-shadow:0 5px 0 #1f6fb0}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #1f6fb0}
.btn.small{font-size:14px;padding:9px 12px;box-shadow:0 4px 0 #1f6fb0;margin:0}
.btn.ghost{background:var(--panel2);color:var(--text);box-shadow:0 4px 0 #101725}
.btn.good{background:var(--good);color:#052414;box-shadow:0 5px 0 #219a5b}

/* ---------------- DESKTOP SHELL ---------------- */
#desktopScreen{position:absolute;inset:0;display:flex;flex-direction:column}
#topbar{height:38px;flex:none;background:rgba(8,12,20,.92);border-bottom:2px solid #000;
  display:flex;align-items:center;justify-content:space-between;padding:0 8px;font-size:15px}
.tb-btn{background:transparent;border:2px solid transparent;color:var(--text);font-size:15px;
  padding:4px 12px;border-radius:9px}
.tb-btn:hover{background:rgba(255,255,255,.12)}
.tb-mid{color:var(--muted);font-size:14px}
#desk{flex:1;position:relative;overflow:hidden;
  background:
   radial-gradient(900px 600px at 20% 15%, #2c4f6e 0%, transparent 60%),
   radial-gradient(800px 600px at 85% 80%, #3b2f6b 0%, transparent 60%),
   linear-gradient(160deg,#12324a 0%,#101a2c 55%,#0b1120 100%)}
#iconLayer{position:absolute;inset:0;padding:16px;display:grid;
  grid-template-columns:repeat(auto-fill,112px);grid-auto-rows:112px;gap:6px;align-content:start;justify-content:start}
.icon{width:112px;height:112px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:4px;border-radius:14px;border:3px solid transparent;background:transparent;color:#fff;text-align:center}
.icon .em{font-size:46px;line-height:1;filter:drop-shadow(0 3px 4px rgba(0,0,0,.5))}
.icon .nm{font-size:14px;text-shadow:0 2px 4px #000;padding:0 4px;line-height:1.15}
.icon:hover{background:rgba(255,255,255,.10)}
.icon.sel{background:rgba(62,166,255,.30);border-color:var(--accent)}
.icon.pulse{animation:pulse 1.1s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,213,74,.85)}50%{box-shadow:0 0 0 12px rgba(255,213,74,0)}}
#dock{height:66px;flex:none;background:rgba(8,12,20,.92);border-top:2px solid #000;display:flex;
  align-items:center;gap:10px;padding:0 12px}
.dock-launch{display:flex;align-items:center;gap:8px;background:linear-gradient(180deg,#3ea6ff,#2b7fd0);
  color:#04121f;border:none;border-radius:14px;padding:10px 16px;font-size:17px;font-weight:bold;box-shadow:0 4px 0 #17588f}
.dock-launch:active{transform:translateY(2px);box-shadow:0 2px 0 #17588f}
#taskbtns{display:flex;gap:8px;flex:1;overflow:hidden}
.taskbtn{background:var(--panel2);border:2px solid var(--line);color:var(--text);border-radius:10px;
  padding:8px 12px;font-size:14px;white-space:nowrap}
.dock-right{color:var(--muted);font-size:15px}

/* launcher + menus */
#launcher{position:absolute;left:0;right:0;bottom:0;top:0;background:rgba(8,12,20,.88);
  padding:40px;display:flex;flex-direction:column;align-items:center;gap:18px;z-index:60}
#launcher h2{margin:0;font-size:26px}
.lch-grid{display:grid;grid-template-columns:repeat(4,130px);gap:14px}
.lch{background:var(--panel2);border:3px solid var(--line);border-radius:16px;padding:14px 8px;color:var(--text);
  display:flex;flex-direction:column;align-items:center;gap:6px;font-size:14px}
.lch:hover{border-color:var(--accent);background:#2b3854}
.lch .em{font-size:38px}
#sysmenu{position:absolute;right:10px;top:8px;width:250px;background:var(--panel);border:3px solid var(--line);
  border-radius:16px;padding:14px;z-index:70;box-shadow:0 20px 50px rgba(0,0,0,.6)}
#sysmenu .row{display:flex;justify-content:space-between;padding:8px 4px;font-size:16px;border-bottom:1px solid var(--line)}
#sysmenu .row:last-child{border:none}
#ctxmenu{position:absolute;z-index:90;background:var(--panel);border:3px solid var(--line);border-radius:12px;
  padding:6px;min-width:180px;box-shadow:0 14px 40px rgba(0,0,0,.6)}
#ctxmenu button{display:block;width:100%;text-align:left;background:transparent;border:none;color:var(--text);
  padding:10px 12px;font-size:16px;border-radius:8px}
#ctxmenu button:hover{background:var(--accent);color:#04121f}

/* windows */
.win{position:absolute;background:var(--panel);border:3px solid var(--line);border-radius:14px;
  box-shadow:0 24px 60px rgba(0,0,0,.6);display:flex;flex-direction:column;overflow:hidden;z-index:20}
.win-bar{height:44px;flex:none;display:flex;align-items:center;
  justify-content:space-between;padding:0 8px 0 14px;cursor:grab;background:#2a3550;border-bottom:2px solid #161e2e}
.win-bar b{font-size:16px}
.win-x{width:34px;height:34px;border-radius:9px;border:none;background:#b23b3b;color:#fff;font-size:18px;font-weight:bold}
.win-x:hover{background:#e04b4b}
.win-body{flex:1;overflow:auto;position:relative;background:#151b28}

/* coach + spotlight */
#coach{position:absolute;left:16px;bottom:82px;max-width:520px;display:flex;gap:12px;align-items:flex-end;z-index:80}
.coach-face{font-size:44px;filter:drop-shadow(0 4px 6px rgba(0,0,0,.6))}
.coach-bub{background:#fffbe8;color:#1a1a1a;border:3px solid var(--star);border-radius:18px;padding:12px 16px;
  font-size:19px;line-height:1.35;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.coach-bub .pics{display:flex;gap:10px;margin-top:8px;align-items:center}
#spot{position:fixed;border-radius:16px;box-shadow:0 0 0 9999px rgba(0,0,0,.55);pointer-events:none;z-index:75;
  border:4px solid var(--star);transition:all .18s ease}

/* ---------------- HUD ---------------- */
#hud{width:var(--hudw);flex:none;background:var(--panel);border-left:4px solid var(--line);
  display:flex;flex-direction:column;padding:14px;gap:10px;overflow:auto}
.hud-title{font-size:22px;font-weight:bold}
.hud-sub{color:var(--muted);font-size:15px}
.hud-part{background:var(--accent2);color:#fff;border-radius:12px;padding:9px 12px;font-size:16px;font-weight:bold}
.hud-stars{font-size:26px;color:var(--star);font-weight:bold}
.hud-now{background:var(--panel2);border:3px solid var(--accent);border-radius:14px;padding:10px 12px}
.hud-now .lbl{font-size:12px;letter-spacing:1.5px;color:var(--accent);font-weight:bold}
#hudTask{font-size:18px;margin-top:6px;line-height:1.3}
#questList{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
#questList li{font-size:15px;padding:8px 10px;border-radius:10px;background:#161d2c;border-left:5px solid var(--line);color:var(--muted)}
#questList li.cur{border-left-color:var(--accent);color:var(--text);background:#1d2740}
#questList li.done{border-left-color:var(--good);color:var(--good);text-decoration:line-through}
.hud-badges{display:flex;flex-wrap:wrap;gap:6px}
.badge{background:#20304a;border:2px solid var(--good);border-radius:20px;padding:5px 10px;font-size:13px}
.hud-btns{margin-top:auto;display:grid;grid-template-columns:1fr 1fr;gap:6px}

/* mouse pictograms */
.mouse-pic{display:inline-flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;color:#333}
svg.ms{width:34px;height:48px}
.ms .body{fill:#fff;stroke:#333;stroke-width:4}
.ms .btn{fill:#dfe6f0;stroke:#333;stroke-width:3}
.ms .on{fill:#ff5f5f}
.ms .wheel{fill:#333}

/* helper sheet */
#helper{position:fixed;right:calc(var(--hudw) + 10px);bottom:16px;width:min(420px,52vw);max-height:78vh;overflow:auto;background:#fffbe8;color:#1a1a1a;
  border:4px solid var(--star);border-radius:18px;padding:16px;z-index:200;box-shadow:0 24px 60px rgba(0,0,0,.6)}
#helper h3{margin:0 0 10px;font-size:22px}
.hp-row{display:flex;align-items:center;gap:12px;padding:8px 6px;border-bottom:2px dashed #e2d5a5}
.hp-row:last-child{border:none}
.hp-em{font-size:32px;width:44px;text-align:center}
.hp-tx b{font-size:18px}
.hp-tx div{font-size:14px;color:#4a4636}

/* modal / teacher / certificate */
#modal{position:fixed;inset:0;background:rgba(5,8,14,.78);display:flex;align-items:center;justify-content:center;z-index:300}
.modal-card{width:min(620px,92%);background:var(--panel);border:4px solid var(--star);border-radius:22px;padding:26px;text-align:center}
.modal-card h2{margin:0 0 10px;font-size:30px}
.modal-card p{font-size:19px;line-height:1.4}
#teacher{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(680px,94%);max-height:86vh;overflow:auto;
  background:var(--panel);border:4px solid var(--accent);border-radius:20px;padding:20px;z-index:310}
#teacher h3{margin:0 0 8px}
#teacher table{width:100%;border-collapse:collapse;font-size:14px;margin:10px 0}
#teacher td,#teacher th{border:1px solid var(--line);padding:6px 8px;text-align:left}
.tch-row{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
#certificate{position:fixed;inset:0;background:#0b1020;display:flex;align-items:center;justify-content:center;z-index:320;padding:20px}
.cert{width:min(820px,96%);background:#fffdf4;color:#1a1a1a;border:14px double #b8952f;border-radius:10px;padding:34px;text-align:center}
.cert h1{font-size:38px;margin:6px 0}
.cert .nm{font-size:44px;color:#123;border-bottom:3px solid #b8952f;display:inline-block;padding:0 30px 6px;margin:12px 0}
.cert ul{text-align:left;display:inline-block;font-size:18px;line-height:1.7}
@media print{ body *{visibility:hidden} #certificate,#certificate *{visibility:visible}
  #certificate{position:absolute;inset:0;background:#fff} .noprint{display:none !important} }

/* picture (support) mode */
body.support .icon .nm{font-size:16px;font-weight:bold;background:rgba(0,0,0,.45);border-radius:8px}
body.support .coach-bub{font-size:22px}
body.support #hudTask{font-size:21px}
.picrow{display:flex;gap:8px;align-items:center;margin-top:8px}
.tag{background:#0f1726;border:2px solid var(--line);border-radius:8px;padding:2px 8px;font-size:13px;color:var(--muted)}

/* smaller lab screens */
@media (max-width:1180px){
  :root{--hudw:264px}
  .icon{width:96px;height:96px} .icon .em{font-size:38px} .icon .nm{font-size:13px}
  #iconLayer{grid-template-columns:repeat(auto-fill,96px);grid-auto-rows:96px}
  .hud-title{font-size:19px} #hudTask{font-size:16px} #questList li{font-size:13.5px}
  #coach{max-width:400px} .coach-bub{font-size:17px}
}
@media (max-width:920px){
  :root{--hudw:224px}
  .lch-grid{grid-template-columns:repeat(3,120px)}
  #coach{max-width:330px} .coach-bub{font-size:15px} svg.ms{width:28px;height:40px}
}

/* levels, shortcut doc, speed typing */
.lvlbar{display:flex;gap:5px;align-items:center}
.lvl{width:26px;height:26px;border-radius:50%;background:#26324c;border:2px solid #3b4a6b;
  display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--muted)}
.lvl.on{background:var(--star);color:#231a00;border-color:#fff;font-weight:bold}
.doc-app{border:3px solid var(--line);border-radius:12px;overflow:hidden;background:#0f1420;margin-bottom:8px}
.doc-bar{background:#26324c;padding:8px 12px;font-size:15px;display:flex;justify-content:space-between}
.doc-save{color:var(--good)}
.doc-body{padding:12px;min-height:84px;font-size:20px;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.doc-line{padding:2px 6px;border-radius:6px}
.doc-line.sel{background:#2f6fd0;color:#fff}
.clip-row{min-height:30px;margin-bottom:4px}
.speed-badge{display:inline-block;background:#26324c;border:2px solid var(--line);border-radius:20px;
  padding:4px 14px;font-size:15px;margin-bottom:8px}
.target{font-size:27px;letter-spacing:.5px;padding:12px;background:#0f1420;border-radius:12px;
  border:3px solid var(--line);min-height:58px;color:var(--muted)}
.target span.ok{color:var(--good)}
.target span.no{color:var(--bad);background:rgba(255,107,107,.22);border-radius:3px}
.timer-wrap{height:14px;background:#0f1420;border-radius:8px;border:2px solid var(--line);overflow:hidden;margin:10px auto;width:92%}
.timer-bar{height:100%;background:linear-gradient(90deg,#3ddc84,#ffd54a,#ff6b6b)}
.wpm{font-size:34px;color:var(--star);font-weight:bold;margin:6px 0}
.wpm span{font-size:15px;color:var(--muted);font-weight:normal}
/* screenshot + upload */
.card-step{padding:20px;text-align:center;font-size:19px;line-height:1.4}
.shot-keys{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:14px 0}
.shot-key{background:#26324c;border:3px solid #3b4a6b;border-radius:12px;padding:10px 14px;font-size:15px;color:var(--muted);max-width:190px}
.shot-key b{display:block;font-size:18px;color:var(--star);margin-bottom:4px}
#flashfx{position:fixed;inset:0;background:#fff;z-index:400;pointer-events:none;animation:flashy .55s ease-out forwards}
@keyframes flashy{0%{opacity:.85}100%{opacity:0}}
.drop{border:4px dashed var(--line);border-radius:16px;padding:24px;text-align:center;font-size:18px;color:var(--muted);margin:10px}
.drop.over{border-color:var(--good);background:rgba(61,220,132,.14);color:var(--text)}
.filecard{display:inline-flex;align-items:center;gap:8px;background:#26324c;border:3px solid var(--line);
  border-radius:12px;padding:10px 14px;font-size:16px;cursor:grab}
.filecard:active{cursor:grabbing}
.prog{height:14px;background:#0f1420;border:2px solid var(--line);border-radius:8px;overflow:hidden;margin:12px 20px}
.prog i{display:block;height:100%;background:var(--good);width:0;transition:width .3s}
.realworld{background:#1a2233;border-left:6px solid var(--star);border-radius:10px;padding:12px 14px;margin:12px;
  font-size:16px;text-align:left;line-height:1.5}
.crumb{padding:8px 10px;color:var(--muted);font-size:15px;display:flex;gap:6px;align-items:center}
.crumb button{background:transparent;border:none;color:var(--accent);font-size:15px;text-decoration:underline}

/* game bits */
.game-wrap{position:absolute;inset:0;display:flex;flex-direction:column}
.game-head{flex:none;padding:8px 12px;background:#1c2436;border-bottom:2px solid var(--line);display:flex;
  justify-content:space-between;align-items:center;font-size:16px;gap:10px}
.game-area{flex:1;position:relative;overflow:hidden;background:#101725}
.balloon{position:absolute;width:74px;height:74px;border-radius:50%;border:4px solid rgba(255,255,255,.5);
  font-size:34px;display:flex;align-items:center;justify-content:center;color:#fff;box-shadow:0 6px 18px rgba(0,0,0,.5)}
.balloon:active{transform:scale(.92)}
.shape{position:absolute;width:88px;height:88px;border-radius:14px;display:flex;align-items:center;justify-content:center;
  font-size:40px;border:4px solid transparent;background:#26324c}
.shape.sel{border-color:var(--accent);background:#2f4a74}
.shape.open{border-color:var(--good);background:#1f4a35}
.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.sq-page{position:relative;padding:20px 26px;font-size:18px;line-height:1.6;color:#cdd9ee}
.sq-star{position:absolute;font-size:40px;background:transparent;border:none;filter:drop-shadow(0 0 8px var(--star))}
.kb{display:flex;flex-direction:column;gap:6px;align-items:center;padding:10px}
.kb-row{display:flex;gap:6px}
.key{min-width:44px;height:46px;border-radius:9px;background:#26324c;border:3px solid #3b4a6b;color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:16px;padding:0 10px}
.key.wide{min-width:100px}.key.xwide{min-width:170px}
.key.hot{background:var(--star);color:#231a00;border-color:#fff;animation:pulse 1s infinite}
.key.hit{background:var(--good);color:#04210f}
.prompt-big{font-size:26px;text-align:center;padding:10px}
.type-box{width:92%;margin:8px auto;display:block;font-size:26px;padding:12px;border-radius:12px;
  border:3px solid var(--line);background:#0f1420;color:#fff;text-align:center}
.hunt-list{list-style:none;margin:0;padding:12px;display:flex;flex-direction:column;gap:8px}
.hunt-list li{font-size:17px;background:#1a2233;border-left:6px solid var(--line);padding:10px 12px;border-radius:10px;color:var(--muted)}
.hunt-list li.done{border-left-color:var(--good);color:var(--good)}
.paint-tools{flex:none;display:flex;gap:8px;padding:8px;background:#1c2436;border-bottom:2px solid var(--line);align-items:center}
.swatch{width:34px;height:34px;border-radius:50%;border:3px solid #fff}
.swatch.on{outline:4px solid var(--star)}
.filelist{padding:6px}
.filerow{display:flex;gap:10px;align-items:center;padding:10px;border-radius:8px;font-size:17px}
.filerow:hover{background:#1e293c}
</style>
</head>
<body>
<div id="app">
  <div id="stage">

    <section id="loginScreen">
      <div class="login-card">
        <div class="lg-lang">
          <button class="langbtn" data-lang="en">🇺🇸 English</button>
          <button class="langbtn" data-lang="es">🇲🇽 Español</button>
        </div>
        <div class="lg-logo">🐧</div>
        <h1 data-i18n="Computer Lab Login">Computer Lab Login</h1>
        <div id="lgStep1">
          <label data-i18n="1. Click the box, then type your first name.">1. Click the box, then type your first name.</label>
          <input id="lgName" maxlength="14" autocomplete="off" data-i18n-ph="type here" placeholder="type here">
          <button id="lgNext" class="btn" data-i18n="Next ▶">Next ▶</button>
        </div>
        <div id="lgStep2" class="hidden">
          <div class="lg-user"><span>🙂</span><span id="lgUser"></span></div>
          <label id="lgPassLabel"></label>
          <input id="lgPass" type="password" autocomplete="off" placeholder="••••">
          <div class="lg-privacy" data-i18n="🔒 Your password shows as dots. A password is &lt;b&gt;private&lt;/b&gt; — we do not share it."></div>
          <button id="lgLogin" class="btn" data-i18n="Log In ⏎">Log In ⏎</button>
          <div id="lgMsg" class="lg-msg"></div>
        </div>
      </div>
    </section>

function t(s,p){
  let out=(state.lang==='es'&&ES[s]!==undefined)?ES[s]:s;
  if(p) for(const k in p) out=out.split('{'+k+'}').join(p[k]);
  return out;
}
function passWord(){
  if(state.lang==='es') return state.support?'sol':'luna';
  return state.support?'cat':'star';
}
function fixWord(){ return state.lang==='es'?'gato':'cat'; }

/* ---------- sound ---------- */
let actx=null;
function beep(kind){
  if(!state.sound) return;
  try{
    actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    const o=actx.createOscillator(), g=actx.createGain();
    const map={good:[660,880],star:[784,1175],bad:[200,150],pop:[520,700],key:[440,520]};
    const [f1,f2]=map[kind]||map.good;
    o.type='triangle'; o.frequency.setValueAtTime(f1,actx.currentTime);
    o.frequency.exponentialRampToValueAtTime(f2,actx.currentTime+.12);
    g.gain.setValueAtTime(.12,actx.currentTime);
    g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+.25);
    o.connect(g); g.connect(actx.destination); o.start(); o.stop(actx.currentTime+.26);
  }catch(e){}
}

function mousePic(type,label){
  const on={left:'',right:'',wheel:''};
  if(type==='click'||type==='double') on.left='on';
  if(type==='right') on.right='on';
  if(type==='scroll') on.wheel='on';
  const badge = type==='double' ? '<text x="46" y="20" font-size="18" fill="#ff5f5f" font-weight="bold">x2</text>' : '';
  const svg=`<svg class="ms" viewBox="0 0 70 96">
    <rect class="body" x="8" y="6" width="48" height="84" rx="24"/>
    <path class="btn ${on.left}" d="M8 30 L8 30 A24 24 0 0 1 32 6 L32 30 Z"/>
    <path class="btn ${on.right}" d="M32 6 A24 24 0 0 1 56 30 L32 30 Z"/>
    <rect class="wheel ${on.wheel?'on':''}" x="29" y="34" width="6" height="16" rx="3"/>
    ${type==='scroll'?'<text x="44" y="30" font-size="20" fill="#ff5f5f">↕</text>':''}

/* =====================================================================
   QUEST ENGINE
   ===================================================================== */
function setQuests(list,mode='seq'){
  state.quests=list.map(q=>({...q,done:false}));
  state.qi=0; state.mode=mode;
  renderQuests(); showCoach();
}
function currentQuest(){
  if(state.mode==='any') return state.quests.find(q=>!q.done);
  return state.quests[state.qi];
}
function fire(action,data={}){
  const match=q=>!q.done&&q.on===action&&(!q.match||q.match(data));
  let q=null;
  if(state.mode==='any') q=state.quests.find(match);
  else { const c=state.quests[state.qi]; if(c&&match(c)) q=c; }
  if(!q) return false;
  q.done=true; state.stars++; beep('star'); updateStars();
  if(state.mode==='seq') state.qi++;
  renderQuests();
  if(state.quests.every(x=>x.done)){ clearSpot(); setTimeout(()=>partComplete(),450); }
  else { setTimeout(showCoach,120); }
  return true;
}
function renderQuests(){
  const ol=$('#questList'); ol.innerHTML='';
  const cur=currentQuest();
  state.quests.forEach(q=>{
    const li=document.createElement('li');
    li.textContent=(q.done?'✔ ':'• ')+t(q.short);
    if(q.done) li.className='done'; else if(q===cur) li.className='cur';
    ol.appendChild(li);
  });
}
function updateStars(){ $('#starCount').textContent=state.stars; }
function showCoach(){
  const q=currentQuest();
  $('#coach').classList.remove('hidden');
  if(!q){ $('#coachText').textContent=t('Nice work!'); $('#hudTask').textContent=t('Nice work!');
          $('#coachPics').innerHTML=''; $('#hudPics').innerHTML='';
          $('#coachNext').classList.add('hidden'); clearSpot(); return; }
  $('#coachText').innerHTML=t(q.text,q.p);
  $('#hudTask').innerHTML=t(q.text,q.p);
  const pics=(q.pics||[]).map(p=>typeof p==='function'?p():p).join('');
  $('#coachPics').innerHTML=pics;
  $('#hudPics').innerHTML=pics;
  $('#coachNext').classList.toggle('hidden',q.on!=='next');
  $('#coachNext').textContent=t('Got it ▶');
  // never dim the screen while an app window is open — the student is working inside it
  if(q.spot&&Object.keys(openWins).length===0) setTimeout(()=>{
      if(Object.keys(openWins).length===0&&currentQuest()===q) spotlight(q.spot);
    },60);
  else clearSpot();
}
$('#coachNext').onclick=()=>fire('next');

/* spotlight */
let spotTarget=null;
function spotlight(sel){
  const el=typeof sel==='string'?$(sel):sel;
  if(!el){clearSpot();return;}
  spotTarget=el;
  const r=el.getBoundingClientRect(), pad=8, s=$('#spot');
  s.classList.remove('hidden');
  s.style.left=(r.left-pad)+'px'; s.style.top=(r.top-pad)+'px';
  s.style.width=(r.width+pad*2)+'px'; s.style.height=(r.height+pad*2)+'px';
  $$('.pulse').forEach(e=>e.classList.remove('pulse'));
  el.classList.add('pulse');
}
function clearSpot(){ $('#spot').classList.add('hidden'); if(spotTarget){spotTarget.classList.remove('pulse');spotTarget=null;} }
window.addEventListener('resize',()=>{ if(spotTarget) spotlight(spotTarget); });

/* modal */
function modal(html){
  const m=$('#modal'); m.classList.remove('hidden');
  m.innerHTML=`<div class="modal-card">${html}</div>`;
  return m;
}
function closeModal(){ $('#modal').classList.add('hidden'); $('#modal').innerHTML=''; }

  const want=passWord();

    beep('bad'); $('#lgPass').focus();

   WINDOW MANAGER
   ===================================================================== */
const openWins={}; let zTop=20;
// the Helper Sheet floats over the right side of the desk — keep things out from under it
function usableW(){
  const d=$('#desk');
  const h=$('#helper');
  return h.classList.contains('hidden') ? d.clientWidth : Math.max(320,d.clientWidth-h.offsetWidth-30);
}
function openApp(id){
  const a=appById(id); if(!a) return;
  if(openWins[id]){ focusWin(id); return; }
  const w=document.createElement('div');
  w.className='win'; w.id='win-'+id;
  const big=['mouse','scroll','keys','paint','shot','drive','cert'].includes(id);
  const W=big?640:460, H=big?450:340;
  const deskR=$('#desk').getBoundingClientRect();
  const useW=usableW();
  w.style.width=Math.min(W,useW-30)+'px';
  w.style.height=Math.min(H,deskR.height-30)+'px';
  w.style.left=Math.max(10,rnd(20,Math.max(40,useW-W-30)))+'px';
  w.style.top=Math.max(10,rnd(20,Math.max(40,deskR.height-H-60)))+'px';
  w.style.zIndex=++zTop;
  w.innerHTML=`<div class="win-bar"><b>${a.em} ${t(a.name)}</b>
      <button class="win-x" title="${t('Close')}">✕</button></div>
    <div class="win-body"></div>`;
  $('#windows').appendChild(w);
  openWins[id]=w;
  $('.win-x',w).onclick=()=>closeApp(id);
  w.addEventListener('mousedown',()=>focusWin(id));
  dragify(w,$('.win-bar',w));
  buildAppBody(id,$('.win-body',w));
  refreshTaskbar();
  clearSpot();
  beep('pop');
  fire('app:open',{id});
}
function closeApp(id){
  const w=openWins[id]; if(!w) return;
  w.remove(); delete openWins[id];
  refreshTaskbar(); beep('good');
  fire('app:close',{id});
  if(Object.keys(openWins).length===0) fire('desktop:clear');
}
function focusWin(id){ const w=openWins[id]; if(w) w.style.zIndex=++zTop; }
function refreshTaskbar(){
  const bar=$('#taskbtns'); bar.innerHTML='';
  Object.keys(openWins).forEach(id=>{
    const a=appById(id);
    const b=document.createElement('button'); b.className='taskbtn';
    b.innerHTML=a.em+' '+t(a.name); b.onclick=()=>focusWin(id);
    bar.appendChild(b);
  });
}
function dragify(win,handle){
  let sx,sy,ox,oy,drag=false;
  handle.addEventListener('mousedown',e=>{
    if(e.target.closest('.win-x')) return;
    drag=true; sx=e.clientX; sy=e.clientY;
    ox=parseInt(win.style.left); oy=parseInt(win.style.top);
    handle.style.cursor='grabbing'; e.preventDefault();
  });
  window.addEventListener('mousemove',e=>{
    if(!drag) return;
    const deskR=$('#desk').getBoundingClientRect();
    let nx=ox+e.clientX-sx, ny=oy+e.clientY-sy;
    nx=Math.max(0,Math.min(nx,deskR.width-win.offsetWidth));
    ny=Math.max(0,Math.min(ny,deskR.height-win.offsetHeight));
    win.style.left=nx+'px'; win.style.top=ny+'px';
    if(Math.abs(e.clientX-sx)+Math.abs(e.clientY-sy)>60) fire('win:drag',{});
  });
  window.addEventListener('mouseup',()=>{ drag=false; handle.style.cursor='grab'; });
}

function appPaint(b){
  b.innerHTML=`<div class="game-wrap">
    <div class="paint-tools">
      <span style="font-size:15px">${t('Hold the left button and drag to draw:')}</span>
      <span class="swatch on" data-c="#ff5f5f" style="background:#ff5f5f"></span>
      <span class="swatch" data-c="#3ea6ff" style="background:#3ea6ff"></span>
      <span class="swatch" data-c="#3ddc84" style="background:#3ddc84"></span>
      <span class="swatch" data-c="#ffd54a" style="background:#ffd54a"></span>
      <button class="btn small ghost" id="pClear">${t('Clear')}</button>
    </div>
    <div class="game-area" style="background:#fff"><canvas id="pCanvas" style="position:absolute;inset:0"></canvas></div>
  </div>`;
  const cv=$('#pCanvas',b), area=$('.game-area',b);
  const fit=()=>{ cv.width=area.clientWidth; cv.height=area.clientHeight; };
  setTimeout(fit,30);
  const ctx=cv.getContext('2d'); let drawing=false,color='#ff5f5f',dist=0,fired=false,lx=0,ly=0;
  $$('.swatch',b).forEach(s=>s.onclick=()=>{ $$('.swatch',b).forEach(x=>x.classList.remove('on')); s.classList.add('on'); color=s.dataset.c; });
  $('#pClear',b).onclick=()=>ctx.clearRect(0,0,cv.width,cv.height);
  const pos=e=>{const r=cv.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top];};
  cv.addEventListener('mousedown',e=>{ drawing=true; const[x,y]=pos(e); lx=x; ly=y; ctx.beginPath(); ctx.moveTo(x,y); });
  cv.addEventListener('mousemove',e=>{
    if(!drawing) return;
    const[x,y]=pos(e);
    ctx.strokeStyle=color; ctx.lineWidth=6; ctx.lineCap='round'; ctx.lineTo(x,y); ctx.stroke();
    dist+=Math.hypot(x-lx,y-ly); lx=x; ly=y;
    if(dist>90&&!fired){ fired=true; fire('paint:draw',{}); }
  });
  window.addEventListener('mouseup',()=>drawing=false);
}

function appShot(b){
  let card=0;
  const shotName=state.lang==='es'?'certificado.png':'certificate.png';
  const cards=[
    ()=>`<div class="card-step">
      <div style="font-size:52px">📸</div>

      <button class="btn" id="shotNext">${t('Next ▶')}</button></div>`,
    ()=>`<div class="card-step">
      <h3 style="margin:4px 0 0">${t('The screenshot keys on Linux')}</h3>
      <div class="shot-keys">
        <div class="shot-key"><b>PrtScn</b>${t('The whole screen')}</div>

      </div>
      <p style="font-size:17px">${t('The key is at the top of the keyboard. It can say <b>PrtScn</b>, <b>PrtSc</b>, or <b>Print Screen</b>.')}</p>
      <button class="btn" id="shotNext">${t('Next ▶')}</button></div>`,
    ()=>`<div class="card-step">
      <h3 style="margin:4px 0 0">${t('Where does it go?')}</h3>
      <p>${t('Linux saves your picture in <b>Pictures → Screenshots</b>. You can open it in <b>Files</b> 📁 any time.')}</p>
      <div class="realworld">${t('Some Linux computers open a little screenshot window instead. If that happens, click <b>Take Screenshot</b> or <b>Save</b> in that window — same job, one extra click.')}</div>
      <button class="btn" id="shotNext">${t('I am ready to try ▶')}</button></div>`
  ];
  function drawCard(){
    b.innerHTML=cards[card]();
    $('#shotNext',b).onclick=()=>{
      card++; beep('good');
      if(card<cards.length) drawCard();
      else { fire('shot:learned',{}); practice(); }
    };
  }
  function practice(){
    b.innerHTML=`<div class="card-step">
      <div style="font-size:46px">🖥️📸</div>

      <div style="font-size:16px;color:var(--muted)">${t('Did the screen flash, or a window pop up? That means it worked.')}</div>

      </div>

    $('#prtBtn',b).onclick=takeIt;
    $('#shotOK',b).onclick=takeIt;
    $('#shotHelp',b).onclick=()=>{
      $('#shotHelpBox',b).innerHTML=`<div class="realworld">${t('No problem. Try one of these: hold <b>Shift</b> and press <b>PrtScn</b>, or open the <b>Screenshot</b> app from the App Launcher 🚀 and click <b>Take Screenshot</b>. Then come back and click ✅.')}</div>`;
    };

  function takeIt(){

/* =====================================================================
   GAME 1 — MOUSE MASTER  (click / select / double-click / right-click)
   ===================================================================== */
function gameMouse(b){
  const N=state.support?{pop:5,sel:3,dbl:3,rc:1}:{pop:8,sel:3,dbl:5,rc:2};
  b.innerHTML=`<div class="game-wrap">
    <div class="game-head"><span id="mmTitle">Round 1</span><span id="mmScore"></span></div>
    <div class="game-area" id="mmArea"></div></div>`;
  const area=$('#mmArea',b), title=$('#mmTitle',b), score=$('#mmScore',b);
  let misses=0, round=0;
  const AW=()=>area.clientWidth-100, AH=()=>area.clientHeight-100;
  const place=el=>{ el.style.left=rnd(10,Math.max(20,AW()))+'px'; el.style.top=rnd(10,Math.max(20,AH()))+'px'; };
  area.addEventListener('click',e=>{
    if(e.target===area){ misses++; if(misses%3===0) coachSay('Slow down 🐢 — put the arrow ON the picture, then click.'); }
  });

  function head(ttl,sc){ title.innerHTML=ttl; score.innerHTML=sc; }

  function r1(){ // single click
    let got=0; head(t('Round 1 of 4 — SINGLE CLICK ')+PIC.click(), `${t('Popped:')} <b>0/${N.pop}</b>`);
    coachSay('Pop the balloons with <b>one click</b>.',[PIC.click]);
    area.innerHTML='';
    for(let i=0;i<N.pop;i++){
      const el=document.createElement('button');
      el.className='balloon'; el.textContent='🎈';
      el.style.background=pick(['#e05b6a','#4a8fe0','#4bb87a','#c58ae0','#e0a54b']);
      place(el);
      el.onclick=ev=>{ ev.stopPropagation(); el.remove(); got++; beep('pop');
        head(t('Round 1 of 4 — SINGLE CLICK ')+PIC.click(),`${t('Popped:')} <b>${got}/${N.pop}</b>`);
        if(got===N.pop) done(r2); };
      area.appendChild(el);
    }
  }
  function r2(){ // select
    let sel=0; head(t('Round 2 of 4 — SELECT with one click ')+PIC.click(),`${t('Chosen:')} <b>0/${N.sel}</b>`);
    coachSay('<b>One click chooses</b> a thing. Click each shape one time — it turns blue.',[PIC.click]);
    area.innerHTML='';
    for(let i=0;i<N.sel;i++){
      const el=document.createElement('button');
      el.className='shape'; el.textContent=pick(['🔺','🟩','🟦','⬛','🟣']); place(el);
      el.onclick=ev=>{ ev.stopPropagation();
        if(el.classList.contains('sel')) return;
        el.classList.add('sel'); sel++; beep('good');
        head(t('Round 2 of 4 — SELECT with one click ')+PIC.click(),`${t('Chosen:')} <b>${sel}/${N.sel}</b>`);
        if(sel===N.sel) done(r3); };
      area.appendChild(el);
    }
  }
  function r3(){ // double click
    let op=0; head(t('Round 3 of 4 — DOUBLE-CLICK to open ')+PIC.double(),`${t('Opened:')} <b>0/${N.dbl}</b>`);
    coachSay('<b>Two fast clicks</b> opens a thing. Double-click every box!',[PIC.double]);
    area.innerHTML='';
    for(let i=0;i<N.dbl;i++){
      const el=document.createElement('button');
      el.className='shape'; el.textContent='📦'; place(el);
      el.onclick=ev=>{ ev.stopPropagation();
        if(el.classList.contains('open')) return;
        el.classList.add('shake'); setTimeout(()=>el.classList.remove('shake'),320);
        coachSay('One click only <b>chooses</b>. Click <b>two times fast</b> to open!',[PIC.double]); };
      el.ondblclick=ev=>{ ev.stopPropagation();
        if(el.classList.contains('open')) return;
        el.classList.add('open'); el.textContent='🎁'; op++; beep('star');
        head(t('Round 3 of 4 — DOUBLE-CLICK to open ')+PIC.double(),`${t('Opened:')} <b>${op}/${N.dbl}</b>`);
        if(op===N.dbl) done(r4); };
      area.appendChild(el);
    }
  }
  function r4(){ // right click
    let got=0; head(t('Round 4 of 4 — RIGHT-CLICK for the menu ')+PIC.right(),`${t('Menus:')} <b>0/${N.rc}</b>`);
    coachSay('Press the <b>right</b> mouse button on the folder. A menu appears — then click <b>Open</b>.',[PIC.right]);
    area.innerHTML='';
    for(let i=0;i<N.rc;i++){
      const el=document.createElement('button');
      el.className='shape'; el.textContent='📁'; place(el);
      el.oncontextmenu=ev=>{ ev.preventDefault(); ev.stopPropagation(); popMenu(ev,el); };
      el.onclick=ev=>{ ev.stopPropagation(); coachSay('That is the LEFT button. Use the <b>RIGHT</b> button here.',[PIC.right]); };
      area.appendChild(el);
    }
    function popMenu(ev,el){
      $$('.mini-menu',area).forEach(m=>m.remove());
      const r=area.getBoundingClientRect();
      const m=document.createElement('div'); m.className='mini-menu';
      m.style.cssText='position:absolute;background:#1b2130;border:3px solid #36445f;border-radius:10px;padding:6px;z-index:5';
      m.style.left=(ev.clientX-r.left)+'px'; m.style.top=(ev.clientY-r.top)+'px';
      ['Open','Copy','Rename'].forEach(lab=>{
        const bt=document.createElement('button');
        bt.textContent=t(lab);
        bt.style.cssText='display:block;width:150px;text-align:left;background:transparent;border:none;color:#eef3ff;font-size:16px;padding:8px';
        bt.onmouseenter=()=>bt.style.background='#3ea6ff'; bt.onmouseleave=()=>bt.style.background='transparent';
        bt.onclick=e2=>{ e2.stopPropagation(); m.remove();
          if(lab==='Open'){ el.classList.add('open'); el.textContent='📂'; el.oncontextmenu=null; got++; beep('star');
            head(t('Round 4 of 4 — RIGHT-CLICK for the menu ')+PIC.right(),`${t('Menus:')} <b>${got}/${N.rc}</b>`);
            if(got===N.rc) done(null);
          } else coachSay('Almost! In the menu, click <b>Open</b>.',[PIC.right]);
        };
        m.appendChild(bt);
      });
      area.appendChild(m);
      m.style.left=Math.max(2,Math.min(parseFloat(m.style.left),area.clientWidth-m.offsetWidth-4))+'px';
      m.style.top=Math.max(2,Math.min(parseFloat(m.style.top),area.clientHeight-m.offsetHeight-4))+'px';
      beep('pop');
    }
  }
  function done(next){
    if(next){ area.innerHTML='<div style="padding:30px;text-align:center;font-size:24px">'+t('⭐ Round complete! ⭐')+'</div>'; setTimeout(next,900); }
    else{
      area.innerHTML=`<div style="padding:30px;text-align:center">
        <div style="font-size:52px">🏅</div>
        <div style="font-size:24px;margin:10px 0">${t('Mouse Master finished!')}</div>
        <div style="font-size:17px;color:var(--muted)">${t('Click • Select • Double-click • Right-click')}</div></div>`;
      head(t('Finished 🎉'),'');
      awardBadge('🖱️ Mouse Master'); fire('game:done',{id:'mouse'});
    }
  }
  setTimeout(r1,80);
}

/* =====================================================================
   GAME 3 — KEY HUNT
   ===================================================================== */
let keyGame=null;
const KEY_ROWS=[
  ['1','2','3','4','5','6','7','8','9','0'],
  ['Q','W','E','R','T','Y','U','I','O','P'],
  ['A','S','D','F','G','H','J','K','L'],
  ['Z','X','C','V','B','N','M']
];
function keyLabel(k){
  const en={SPACE:'Space bar',ENTER:'Enter ⏎',BACKSPACE:'Backspace ⌫',SHIFT:'Shift ⇧',
    ARROWLEFT:'← Left arrow',ARROWRIGHT:'→ Right arrow',ARROWUP:'↑ Up arrow',ARROWDOWN:'↓ Down arrow'}[k];
  return en?t(en):k;
}
function tokenOf(e){ return e.key===' '?'SPACE':e.key.toUpperCase(); }
function gameKeys(b){
  /* Three levels: 1 find the keys, 2 keyboard shortcuts, 3 timed typing. */
  b.innerHTML=`<div class="game-wrap">
    <div class="game-head">
      <span id="khTitle">${t('⌨️ Key Hunt')}</span>
      <span class="lvlbar">
        <span class="lvl on" id="lvl1">1</span><span class="lvl" id="lvl2">2</span><span class="lvl" id="lvl3">3</span>
      </span>
      <span id="khScore">0</span></div>
    <div style="flex:none" id="khPrompt" class="prompt-big">${t('Get ready…')}</div>
    <div class="game-area" style="overflow:auto" id="khArea"></div></div>`;
  const area=$('#khArea',b), prompt=$('#khPrompt',b), score=$('#khScore',b), title=$('#khTitle',b);
  const setLevel=n=>{ [1,2,3].forEach(i=>$('#lvl'+i,b).classList.toggle('on',i===n)); };

  /* ---------- shared keyboard picture ---------- */
  function boardHTML(){
    return `<div class="kb" id="khBoard">
      ${KEY_ROWS.map(r=>`<div class="kb-row">${r.map(k=>`<div class="key" data-k="${k}">${k}</div>`).join('')}</div>`).join('')}
      <div class="kb-row">
        <div class="key wide" data-k="CONTROL">${t('Ctrl')}</div>
        <div class="key wide" data-k="SHIFT">${t('⇧ Shift')}</div>
        <div class="key xwide" data-k="SPACE">${t('Space')}</div>
        <div class="key wide" data-k="BACKSPACE">${t('⌫ Backspace')}</div>
        <div class="key wide" data-k="ENTER">${t('⏎ Enter')}</div>
      </div>
      <div class="kb-row">
        <div class="key" data-k="ARROWLEFT">←</div><div class="key" data-k="ARROWUP">↑</div>
        <div class="key" data-k="ARROWDOWN">↓</div><div class="key" data-k="ARROWRIGHT">→</div>
      </div></div>`;
  }
  const flash=(k,cls)=>{ const el=$(`.key[data-k="${k}"]`,b); if(el){ el.classList.add(cls); setTimeout(()=>el.classList.remove(cls),260); } };

  /* =================== LEVEL 1 — find the keys =================== */
  function level1(){
    setLevel(1); title.textContent=t('⌨️ Key Hunt');
    const letters=[], L=state.support?4:6;
    const pool='ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
    while(letters.length<L){ const c=pick(pool); if(!letters.includes(c)) letters.push(c); }
    const digits=[]; const D=state.support?2:3;
    while(digits.length<D){ const c=String(rnd(0,9)); if(!digits.includes(c)) digits.push(c); }
    const extras=state.support?['SPACE','ENTER','BACKSPACE','ARROWLEFT','ARROWRIGHT']
                              :['SPACE','ENTER','BACKSPACE','SHIFT','ARROWLEFT','ARROWRIGHT','ARROWUP','ARROWDOWN'];
    const seq=[...letters,...digits,...extras];
    area.innerHTML=boardHTML();
    let i=0, hintTimer=null;
    coachSay('Look at the big word. Find that key on the real keyboard and press it.',[()=>PIC.key(t('press'))]);
    function ask(){
      clearTimeout(hintTimer);
      $$('.key',b).forEach(k=>k.classList.remove('hot'));
      if(i>=seq.length){ keyGame=null; return level2intro(); }
      const k=seq[i];
      prompt.innerHTML=t('Press &nbsp;')+'<b style="color:var(--star)">'+keyLabel(k)+'</b>';
      score.textContent=i+'/'+seq.length;
      const hot=()=>{ const el=$(`.key[data-k="${k}"]`,b); if(el) el.classList.add('hot'); };
      if(state.support) hot(); else hintTimer=setTimeout(hot,4000);
    }
    keyGame={ onKey(e){
      if(!openWins.keys){ keyGame=null; return; }
      if(i>=seq.length) return;
      const tok=tokenOf(e);
      if(['SPACE','BACKSPACE','ARROWLEFT','ARROWRIGHT','ARROWUP','ARROWDOWN'].includes(tok)) e.preventDefault();
      if(tok===seq[i]){ flash(tok,'hit'); i++; beep('key'); ask(); }
      else if(tok.length===1||['SHIFT','ENTER','BACKSPACE','SPACE'].includes(tok)){
        prompt.insertAdjacentHTML('beforeend',' <span style="color:var(--bad);font-size:18px">'+t('not that one')+'</span>');
        setTimeout(ask,600);
      }
    }};
    ask();
  }

  /* =================== LEVEL 2 — shortcut school =================== */
  function level2intro(){
    setLevel(2); title.textContent=t('⌨️ Shortcut School');
    prompt.innerHTML=t('Level 2 — Keyboard shortcuts');
    score.textContent='';
    area.innerHTML=`<div style="padding:22px;text-align:center">
      <div style="font-size:46px">🎹</div>
      <div style="font-size:21px;margin:10px 0">${t('A <b>shortcut</b> is two keys pressed together. Hold <b>Ctrl</b> down, then tap the letter.')}</div>
      <div style="font-size:17px;color:var(--muted);margin-bottom:14px">${t('Shortcuts do jobs fast — copy, paste, undo, save.')}</div>
      <button class="btn" id="khGo2">${t('Start Level 2 ▶')}</button></div>`;
    $('#khGo2',b).onclick=level2;
    beep('star');
  }
  function level2(){
    const SENT=t('I can use a computer.');
    const steps=state.support
      ? [['A','select'],['C','copy'],['V','paste'],['S','save']]
      : [['A','select'],['C','copy'],['V','paste'],['X','cut'],['Z','undo'],['S','save']];
    const HOW={
      select:'<b>Ctrl + A</b> — select ALL the text. It turns blue.',
      copy:'<b>Ctrl + C</b> — copy the blue text. Now it is on the clipboard.',
      paste:'<b>Ctrl + V</b> — paste. The words appear again.',
      cut:'<b>Ctrl + X</b> — cut. The text goes away and waits on the clipboard.',
      undo:'<b>Ctrl + Z</b> — undo. It brings back what you cut. Ctrl+Z is the fix-it key!',
      save:'<b>Ctrl + S</b> — save your work. Do this a lot!'
    };
    let i=0, lines=[SENT], selected=false, clip='', cut=false;
    area.innerHTML=`<div style="padding:12px">
      <div class="doc-app">
        <div class="doc-bar">📝 ${t('my-work.txt')} <span id="docSave" class="doc-save"></span></div>
        <div class="doc-body" id="docBody"></div>
      </div>
      <div id="clipRow" class="clip-row"></div>
      ${boardHTML()}</div>`;
    const draw=()=>{
      $('#docBody',b).innerHTML=lines.map(l=>`<div class="doc-line ${selected?'sel':''}">${l}</div>`).join('');
      $('#clipRow',b).innerHTML=clip?`<span class="tag">📋 ${t('Clipboard:')} <b>${clip}</b></span>`:'';
    };
    function ask(){
      $$('.key',b).forEach(k=>k.classList.remove('hot'));
      if(i>=steps.length) return level3intro();
      const [letter,what]=steps[i];
      score.textContent=i+'/'+steps.length;
      prompt.innerHTML=t('Press &nbsp;')+`<b style="color:var(--star)">Ctrl + ${letter}</b>`;
      coachSay(HOW[what]);
      const hot=()=>{ ['CONTROL',letter].forEach(k=>{const el=$(`.key[data-k="${k}"]`,b); if(el) el.classList.add('hot');}); };
      if(state.support) hot(); else setTimeout(()=>{ if(steps[i]&&steps[i][0]===letter) hot(); },3500);
      draw();
    }
    function apply(what){
      if(what==='select') selected=true;
      if(what==='copy'){ clip=SENT; }
      if(what==='paste'){ lines=[...lines,SENT]; selected=false; }
      if(what==='cut'){ clip=SENT; lines=lines.slice(0,-1); cut=true; if(!lines.length) lines=[]; }
      if(what==='undo'&&cut){ lines=[...lines,SENT]; cut=false; }
      if(what==='save'){ $('#docSave',b).textContent='✓ '+t('Saved'); }
      draw();
    }
    keyGame={ onKey(e){
      if(!openWins.keys){ keyGame=null; return; }
      if(i>=steps.length) return;
      const ctrl=e.ctrlKey||e.metaKey;
      const letter=(e.key||'').toUpperCase();
      if(ctrl&&['A','C','V','X','Z','S','P','F'].includes(letter)) e.preventDefault();  // keep the browser out of it
      if(!ctrl) {
        if(letter.length===1){ coachSay('Hold <b>Ctrl</b> down FIRST, then tap the letter.'); }
        return;
      }
      flash('CONTROL','hit');
      if(letter===steps[i][0]){
        flash(letter,'hit'); beep('star');
        apply(steps[i][1]); i++;
        setTimeout(ask,520);
      } else {
        prompt.insertAdjacentHTML('beforeend',' <span style="color:var(--bad);font-size:18px">'+t('not that one')+'</span>');
        setTimeout(ask,700);
      }
    }};
    ask();
  }

  /* =================== LEVEL 3 — typing speed =================== */
  function level3intro(){
    setLevel(3); title.textContent=t('⌨️ Speed Typing');
    prompt.innerHTML=t('Level 3 — Typing speed');
    score.textContent='';
    keyGame=null;
    area.innerHTML=`<div style="padding:22px;text-align:center">
      <div style="font-size:46px">⏱️</div>
      <div style="font-size:21px;margin:10px 0">${t('Now for speed! Type what you see before the bar runs out.')}</div>
      <div style="font-size:17px;color:var(--muted);margin-bottom:14px">${t('Three speeds: Warm Up, Faster, Speedy. Keep your eyes on the words.')}</div>
      <button class="btn" id="khGo3">${t('Start Level 3 ▶')}</button></div>`;
    $('#khGo3',b).onclick=()=>speedRound(0);
    beep('star');
  }
  const SPEEDS=[
    {name:'Warm Up',   secs:state.support?16:12, items:['cat dog','red bus','my desk','I can type']},
    {name:'Faster',    secs:state.support?14:9,  items:['click the icon','open the app','save my work','press the space bar']},
    {name:'Speedy',    secs:state.support?16:11, items:['I can use the mouse and keyboard','double click opens an app','Ctrl S saves my work']}
  ];
  function speedRound(r){
    if(r>=SPEEDS.length) return finishKeys();
    const set=SPEEDS[r];
    const items=state.support?set.items.slice(0,3):set.items;
    let idx=0, correct=0, started=0, totalChars=0, totalMs=0;
    title.textContent=t('⌨️ Speed Typing')+' — '+t(set.name);
    area.innerHTML=`<div style="padding:14px;text-align:center">
      <div class="speed-badge">${t(set.name)} — ${items.length} ${t('lines')}</div>
      <div class="target" id="spTarget"></div>
      <input class="type-box" id="spInput" autocomplete="off" spellcheck="false">
      <div class="timer-wrap"><div class="timer-bar" id="spBar"></div></div>
      <div id="spMsg" style="font-size:17px;color:var(--muted);height:24px;margin-top:6px"></div></div>`;
    const target=$('#spTarget',b), inp=$('#spInput',b), bar=$('#spBar',b), msg=$('#spMsg',b);
    let timer=null, tick=null;
    function show(){
      const want=t(items[idx]);
      score.textContent=(idx)+'/'+items.length;
      prompt.innerHTML=t('Type it fast! &nbsp;')+`<b style="color:var(--star)">${set.secs} ${t('sec')}</b>`;
      target.innerHTML=want.split('').map((c,n)=>`<span data-n="${n}">${c===' '?'&nbsp;':c}</span>`).join('');
      inp.value=''; inp.focus(); msg.textContent='';
      started=Date.now();
      bar.style.transition='none'; bar.style.width='100%';
      requestAnimationFrame(()=>{ bar.style.transition=`width ${set.secs}s linear`; bar.style.width='0%'; });
      clearTimeout(timer);
      timer=setTimeout(()=>{ msg.innerHTML='⏳ '+t('Time! Try that one again.'); beep('bad'); show(); }, set.secs*1000);
    }
    inp.addEventListener('input',()=>{
      const want=t(items[idx]), got=inp.value;
      $$('#spTarget span',b).forEach((sp,n)=>{
        sp.className = n>=got.length ? '' : (got[n]===want[n] ? 'ok' : 'no');
      });
      if(got===want){
        clearTimeout(timer);
        const ms=Date.now()-started;
        totalChars+=want.length; totalMs+=ms; correct++;
        const wpm=Math.max(1,Math.min(180,Math.round((want.length/5)/(ms/60000))));
        msg.innerHTML='✅ '+t('Nice! {wpm} words per minute',{wpm:wpm});
        beep('star'); idx++;
        if(idx>=items.length){
          const avg=Math.max(1,Math.min(180,Math.round((totalChars/5)/(totalMs/60000))));
          bar.style.transition='none'; bar.style.width='0%';
          setTimeout(()=>roundDone(r,avg),700);
        } else setTimeout(show,700);
      }
    });
    inp.addEventListener('keydown',e=>{ if(e.key==='Enter') e.preventDefault(); });
    show();
  }
  function roundDone(r,wpm){
    prompt.innerHTML=t('Round finished! 🎉');
    area.innerHTML=`<div style="padding:24px;text-align:center">
      <div style="font-size:46px">${r===SPEEDS.length-1?'🏆':'⚡'}</div>
      <div style="font-size:23px;margin:8px 0">${t('{name} complete!',{name:t(SPEEDS[r].name)})}</div>
      <div class="wpm">${wpm} <span>${t('words per minute')}</span></div>
      <button class="btn" id="khNextR">${r===SPEEDS.length-1?t('Finish ▶'):t('Next speed ▶')}</button></div>`;
    $('#khNextR',b).onclick=()=>{ if(r===SPEEDS.length-1) finishKeys(wpm); else speedRound(r+1); };
    beep('star');
  }

  function finishKeys(wpm){
    prompt.innerHTML=t('Finished! 🎉');
    area.innerHTML=`<div style="padding:26px;text-align:center">
      <div style="font-size:52px">🏅</div><div style="font-size:24px">${t('Key Hunt finished!')}</div>
      <div style="color:var(--muted);font-size:17px;margin-top:6px">${t('Letters • Numbers • Space • Enter • Backspace • Shift • Arrows')}</div>
      <div style="color:var(--muted);font-size:17px">${t('Ctrl + A C V X Z S')}</div>
      ${wpm?`<div class="wpm" style="margin-top:10px">${wpm} <span>${t('words per minute')}</span></div>`:''}</div>`;
    score.textContent=t('Done');
    keyGame=null;
    awardBadge('⌨️ Key Finder'); awardBadge('🎹 Shortcut Pro'); awardBadge('⚡ Speed Typer');
    fire('game:done',{id:'keys'});
  }

  level1();
}

      <tr><td>0:18–0:38</td><td>${t('Mouse &amp; Keyboard Games')}</td><td>${t('Mouse Master (4 rounds), Scroll Quest, Key Hunt')}</td></tr>
      <tr><td>0:38–0:46</td><td>${t('Scavenger Hunt / Closure')}</td><td>${t('7-item hunt, exit question, certificate')}</td></tr>
      <tr><td>0:46–0:52</td><td>${t('Screenshot &amp; Hand-In')}</td><td>${t('PrtScn lesson, find it in Files, practice upload, real Drive steps')}</td></tr>
    </table>
    <div class="tch-row">
      <button class="btn small ghost" data-p="1">${t('▶ Part 1')}</button>
      <button class="btn small ghost" data-p="2">${t('▶ Part 2')}</button>
      <button class="btn small ghost" data-p="3">${t('▶ Part 3')}</button>
      <button class="btn small ghost" data-p="4">${t('▶ Part 4')}</button>
      <button class="btn small ghost" data-p="5">${t('▶ Part 5')}</button>
      <button class="btn small ghost" id="tchCert">${t('▶ Exit ticket')}</button>
    </div>
    <p style="font-size:14px">${t('<b>Picture Mode</b> (SWIEP/ELL): fewer targets, larger labels, key hints shown right away, Helper Sheet pinned open, shorter password ({word}).',{word:'<i>'+(state.lang==='es'?'sol':'cat')+'</i>'})}</p>
    <div class="tch-row">
      <button class="btn small ghost" id="tchReset">${t('🔄 Restart from login')}</button>
      <button class="btn small" id="tchClose">${t('Close panel')}</button>
    </div>`;
  $$('#teacher [data-setlang]').forEach(b=>b.onclick=()=>setLang(b.dataset.setlang));
  $$('#teacher [data-p]').forEach(b=>b.onclick=()=>{
    $('#teacher').classList.add('hidden'); closeModal();
    Object.keys(openWins).forEach(closeApp);
    if(+b.dataset.p===5&&!openWins.cert){ state.part=5; buildIcons(); openApp('cert'); }
    [null,startPart1,startPart2,startPart3,startPart4,startPart5][+b.dataset.p]();
  });
  $('#tchCert').onclick=()=>{ $('#teacher').classList.add('hidden'); exitTicket(); };
  $('#tchReset').onclick=()=>location.reload();
  $('#tchClose').onclick=()=>$('#teacher').classList.add('hidden');
}

/* =====================================================================
   LANGUAGE SWITCHING
   ===================================================================== */
function setLang(lang){
  if(lang!==state.lang){ state.lang=lang; try{ localStorage.setItem('dq_lang',lang); }catch(e){} }
  applyLang();
}
function applyLang(){
  document.documentElement.lang=state.lang;
  document.title=t('Desktop Quest — Mouse &amp; Keyboard Lab').replace('&amp;','&');
  // static text marked with data-i18n / data-i18n-ph
  $$('[data-i18n]').forEach(el=>{ el.innerHTML=t(el.dataset.i18n); });
  $$('[data-i18n-ph]').forEach(el=>{ el.placeholder=t(el.dataset.i18nPh); });
  $$('.langbtn').forEach(b=>b.classList.toggle('on',b.dataset.lang===state.lang));
  $('#btnLang').textContent=state.lang==='en'?'🌐 Cambiar a Español':'🌐 Switch to English';
  $('#btnSupport').textContent=t('🖼️ Picture Mode: ')+(state.support?t('ON'):t('OFF'));
  $('#btnSound').textContent=t('🔊 Sound: ')+(state.sound?t('ON'):t('OFF'));
  $('#btnHelper').textContent=t('📖 Helper Sheet');
  $('#btnTeacher').textContent=t('👩‍🏫 Teacher');
  $('#hudPart').innerHTML=t(PART_NAMES[state.part||1]);
  if(!state.quests.length) $('#hudName').textContent=t('Player');
  renderPassLabel();
  // rebuild everything that is drawn from JS
  buildIcons(); buildLauncher(); buildSys(); buildHelper(); buildTeacher(); renderBadges();
  Object.keys(openWins).forEach(id=>{
    const w=openWins[id], a=appById(id);
    $('.win-bar b',w).textContent=a.em+' '+t(a.name);
    buildAppBody(id,$('.win-body',w));   // games restart in the new language
  });
  refreshTaskbar();
  if(state.quests.length){ renderQuests(); showCoach(); }
}
$('#btnLang').onclick=()=>setLang(state.lang==='en'?'es':'en');
$$('.langbtn').forEach(b=>b.onclick=()=>setLang(b.dataset.lang));

/* =====================================================================
   INIT
   ===================================================================== */
buildIcons(); buildLauncher(); buildSys(); buildHelper(); buildTeacher();
try{ if(localStorage.getItem('dq_support')==='1') $('#btnSupport').click(); }catch(e){}
try{ const L=localStorage.getItem('dq_lang'); if(L==='es'||L==='en') state.lang=L; }catch(e){}
applyLang();
$('#lgName').focus();
window.addEventListener('keydown',e=>{ if(e.key==='Escape'){ toggleLauncher(false); toggleSys(false); hideCtx(); } });
</script>
</body>
</html>
